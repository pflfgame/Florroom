			}

					resultingDamage+=approx(resultingDamage/2)
				} else if(fight.environment===19) {
					resultingDamage+=approx(1.5*resultingDamage)
				}
			}
			if(explore.floor>=1) resultingDamage=approx(resultingDamage*10000/fight.energy)
			if(isMob(mob) && this.effect.hasOwnProperty("resistance")) {
				resultingDamage-=this.effect.resistance
				if(resultingDamage<0) resultingDamage=0
			}
			if(resultingDamage) {
				addLog("[Petal] "+translateText(this.name)+translateText(" received ")+translateText(mobName,"CH")+translateText("造成的","CH")+resultingDamage+translateText("伤害","CH")+translateText(" damage from ","EN")+translateText(mobName,"EN")+translateText("."),"#9f9fdf")
				this.currenthealth-=resultingDamage
			}
			if(this.currenthealth<=0) {
				this.destroy(mob)
			} else {
				if(this.name==="Wax") {
					if(this.def2>betterFloor(this.currenthealth/this.health*10)*10) this.def2=betterFloor(this.currenthealth/this.health*10)*10
					if(this.def2<40) this.def2=40
				}
				this.print()
			}
		}
		Petal.prototype.knockback=function(knockback) {
			let resultingKnockback=knockback,extraDamage=0
			if(this.speed>1 && resultingKnockback>this.actionbar+50) {
				extraDamage=approx((resultingKnockback-this.actionbar-50)/300*this.health)
				resultingKnockback=this.actionbar+50
			}
			if(this.speed===1 && resultingKnockback>this.actionbar) resultingKnockback=this.actionbar
			if(resultingKnockback) {
				addLog("[Petal] "+translateText(this.name)+translateText(" received ")+resultingKnockback+translateText(" knockback."),"#bfbf00")
				this.actionbar-=resultingKnockback
			}
			if(extraDamage) this.injure(extraDamage,"Knockback")
			this.print()
		}
		Petal.prototype.progress=function(value) {
			if(this.state==="Retired") return
			if(this.state==="Suspended") return
			if(this.y===0) return
			let pendingAction=this.speed,maxAction=250
			if(value) pendingAction=value
			if(this.effect.hasOwnProperty("restraint")) {
				pendingAction=approx(pendingAction/2)
				this.effect.restraint--
				if(!this.effect.restraint) delete this.effect.restraint
			}
			if(this.effect.hasOwnProperty("stuckness")) {
				this.effect.stuckness--
				if(!this.effect.stuckness) delete this.effect.stuckness
			}
			if(explore.floor>=1 && fight.energy<6400) pendingAction=approx(pendingAction*(fight.energy-3500)/3000)
			this.actionbar+=pendingAction
			if(this.state==="Existing" && this.name==="Tomato") {
				this.calculate+=pendingAction
				if(this.calculate>600) this.health=approx(this.origin.health*(1.3-this.calculate/2000))
				if(this.health<=0) {
					this.health=1
					this.actionbar=0
					this.destroy()
					return
				}
				if(this.currenthealth>this.health) this.currenthealth=this.health
				this.damage=approx(this.origin.damage*(1+this.calculate/200))
				this.size=this.origin.size+betterFloor(this.calculate/200)
				this.atk1=this.origin.atk1+betterFloor(this.calculate/400)*10
				this.atk2=this.origin.atk2+betterFloor(this.calculate/400)*10
				this.def1=this.origin.def1+betterFloor(this.calculate/400)*10
				this.def2=this.origin.def2+betterFloor(this.calculate/400)*10
				if(this.atk1>100) this.atk1=100
				if(this.atk2>100) this.atk2=100
				if(this.def1>100) this.def1=100
				if(this.def2>100) this.def2=100
			}
			if(this.state==="Reloading" && this.actionbar>=this.reload) this.load()
			if(this.state==="Existing" && this.actionbar>=maxAction) this.actionbar=maxAction
			this.print()
		}
		Petal.prototype.move=function(targetX,targetY) {
			if(this.state==="Suspended") return
			if(targetX!==undefined) {
				if(getFilledGrid(targetX,targetY)) {
					this.attack(targetX,targetY)
					return
				}
				if(fight.environment===9) {
					flowerInjure(approx(fight.flower.health/100),"Environment")
				} else if(fight.environment===20) {
					flowerInjure(approx(fight.flower.health/50),"Environment")

				addLog("[Petal] "+translateText("Movement of ","EN")+translateText(this.name)+translateText("的移动","CH")+": "+translateText("from ")+"("+this.x+","+this.y+")"+translateText(" to ")+"("+targetX+","+targetY+").","#9f9fdf")
				getGrid(0,this.x,this.y).replaceWith(createGrid(0,this.x,this.y,"Empty",1,0))
				this.x=targetX
				this.y=targetY

		Petal.prototype.attack=async function(targetX,targetY) {
			if(this.state==="Suspended") return
			if(targetX!==undefined) {
				let targetMob
				for(let i=0;i<fight.mob.length;i++) if(fight.mob[i].x===targetX && fight.mob[i].y===targetY) targetMob=fight.mob[i]
				if(this.name==="Air" && this.calculate>0) {
					targetMob.move(this.calculate)
					this.calculate=0
				}
				if(fight.environment===9) {
					flowerInjure(approx(fight.flower.health/100),"Environment")
				} else if(fight.environment===20) {
					flowerInjure(approx(fight.flower.health/50),"Environment")
				}
				addLog("[Petal] "+translateText("Attack of ","EN")+translateText(this.name)+translateText("的攻击","CH")+": "+translateText("to ")+translateText(targetMob.name)+translateText(" at ")+"("+targetMob.x+","+targetMob.y+")...","#9f9fdf")
				if(this.name==="Pearl" || determine(AttackSuccessChance(this,targetMob,"Auto","Auto"),true," for attack")) {
					let damageDealt=this.damage*2,damageReceived=targetMob.damage,knockbackDealt=50
					if(this.name==="Rice") {
						knockbackDealt=0
					}
					if(this.name==="Jelly") {
						knockbackDealt+=100
					}
					if(this.name==="Claw" && targetMob.currenthealth===targetMob.health) {
						damageDealt*=5
						targetMob.actionbar=-50
					}
					if(this.name==="Clover" && !this.effect.hasOwnProperty("lucky")) {
						knockbackDealt=approx(knockbackDealt/2)
					}
					if(this.name==="Air") {
						knockbackDealt=approx(knockbackDealt*(0.3+0.1*this.level))
					}
					if(this.name==="Blood Stinger") {
						if(MobAttributeList[targetMob.id].match("Connected")!==null) {
							flowerRetreat()
							return
						} else {
							damageDealt*=2
							flowerInjure(approx(fight.flower.health*(0.2+0.05*this.level)),"Blood Stinger")
						}
					}
					if(this.name==="2 Turn Kill") {
						targetMob.injure({effectturn:2},"Doom")
					}
					if(this.effect.hasOwnProperty("surge")) {
						damageDealt+=approx(damageDealt*this.effect.surge/100)
					}
					if(this.name==="Relic" && targetMob.behavior==="Neutral+") {
						addLog("[Mob] "+translateText(targetMob.name)+translateText(" returns to passive."),"#bfbf00")
						targetMob.behavior="Neutral"
					} else {
						this.injure(damageReceived,targetMob)
						if(targetMob.currenthealth>0) targetMob.injure(damageDealt,this)
					}
					if(knockbackDealt) targetMob.knockback(knockbackDealt)
					if(this.name==="Fangs") {
						flowerHeal(approx(damageDealt/2),"Lifesteal")
					}
					this.print()
					await waitAnimation()
					missileCheck()
					await waitMissile()
					fight.manipulate=false
				} else {
					this.print()
					fight.manipulate=false
				}
				return
			}
			fight.manipulate=true
			operPrepare(this,"Attack")
		}
		Petal.prototype.shoot=async function(targetX,targetY) {
			if(animation) return

			if(targetX!==undefined) {
				let targetMob
				for(let i=0;i<fight.mob.length;i++) if(fight.mob[i].x===targetX && fight.mob[i].y===targetY) targetMob=fight.mob[i]
				if(!targetMob) {
					addLog("[Petal] "+translateText("Shoot of ","EN")+translateText(this.name)+translateText("的射击","CH")+translateText(" ended."),"#9f9fdf")
					this.actionbar=0
					this.destroy("Shoot")
					this.shootatt.bounce=0
					delete this.shootatt.hitarray
					await waitAnimation()
					missileCheck()
					await waitMissile()
					fight.manipulate=false
					collapseTempGrid()
					return
				}
				if(fight.environment===9) {
					flowerInjure(approx(fight.flower.health/100),"Environment")
				} else if(fight.environment===20) {
					flowerInjure(approx(fight.flower.health/50),"Environment")
				}
				addLog("[Petal] "+translateText("Shoot of ","EN")+translateText(this.name)+translateText("的射击","CH")+": "+translateText("to ")+targetMob.name+translateText(" at ")+"("+targetMob.x+","+targetMob.y+")...","#9f9fdf")
				if(determine(ShootSuccessChance(this,targetMob),true," for shoot")) {
					if(getGrid(79,this.shootatt.x,this.shootatt.y)) getGrid(79,this.shootatt.x,this.shootatt.y).style.opacity=0.2
					this.shootatt.x=targetMob.x
					this.shootatt.y=targetMob.y
					let damageDealt=this.damage
					targetMob.injure(damageDealt,this.clone())
					if(this.name==="Grapes" && targetMob.currenthealth>0) {
						targetMob.injure({effectdamage:approx(this.damage/4),effectturn:5},"Poison")
					}
					if(this.name==="Dandelion" && targetMob.currenthealth>0) {
						targetMob.injure({effectturn:5},"Suppression")
					}
					this.shootatt.hitarray.push(targetMob)
					let tempGrid=createGrid(79,targetX,targetY,"Petal_"+PetalNameList[this.id],1,this.rarity)
					tempGrid.classList.add("apos")
					tempGrid.style.top=getGrid(0,targetX,targetY).getBoundingClientRect().top+"px"
					tempGrid.style.left=getGrid(0,targetX,targetY).getBoundingClientRect().left+"px"
					tempGrid.style.opacity=0.5
					document.body.appendChild(tempGrid)
					this.shootatt.bounce++
					this.shootatt.continue=true
					return
				} else {
					this.actionbar=0
					this.destroy("Shoot")
					this.shootatt.bounce=0
					delete this.shootatt.hitarray
					await waitAnimation()
					missileCheck()
					await waitMissile()
					fight.manipulate=false
					collapseTempGrid()
					return
				}
			}
			this.shootatt.bounce=0
			this.shootatt.hitarray=new Array()
			this.shootatt.x=this.x
			this.shootatt.y=this.y
			fight.manipulate=true
			operPrepare(this,"Shoot")
		}

				if(this.effect.doom>resultingTurn) this.effect.doom=resultingTurn

			}

				if(!this.effect.hasOwnProperty("vulnerability")) this.effect.vulnerability=new Array()
				for(let i=0;i<resultingTurn;i++) {
					if(!this.effect.vulnerability.hasOwnProperty(i)) this.effect.vulnerability[i]=0
					this.effect.vulnerability[i]+=resultingStrength
				}
				return
			}
			if(petalName==="Psyonic Connection") {
				addLog("[Mob] "+translateText(this.name)+translateText(" received ")+translateText("灵魂链接造成的","CH")+damage+translateText("伤害","CH")+translateText(" damage from Psyonic Connection","EN")+translateText("."),"#bfbf00")

				this.print()
				if(this.behavior==="Neutral") this.behavior="Neutral+"

				return
			}
			if(petalName==="Absorption") {
				addLog("[Mob] "+translateText("Sponge")+translateText(" received ")+translateText("吸收造成的","CH")+damage+translateText("伤害","CH")+translateText(" damage from Absorption","EN")+translateText("."),"#bfbf00")
				this.currenthealth-=damage
				this.print()
				return
			}
			let resultingDamage=damage
			if(explore.floor>=1) resultingDamage=approx(resultingDamage*fight.energy/10000)
			if(fight.flower.effect.hasOwnProperty("strike3")) {
				if(fight.flower.effect.strike3.hasOwnProperty("debuff")) resultingDamage-=approx(fight.flower.effect.strike3.debuff/100*resultingDamage)
				if(fight.flower.effect.strike3.hasOwnProperty("buff")) resultingDamage+=approx(fight.flower.effect.strike3.buff/100*resultingDamage)
			}
			if(this.effect.hasOwnProperty("vulnerability")) {
				resultingDamage+=this.effect.vulnerability[0]
			}
			if(this.name==="Leafbug") {
				let armorBlock=approx(this.damage/2)
				resultingDamage-=armorBlock
				if(resultingDamage<0) resultingDamage=0
			}
			if(this.name==="!Leafbug!") {
				let armorBlock=approx(0.3*this.damage)
				if(this.effect.quickness>=1) armorBlock=approx(0.6*this.damage)
				if(this.effect.quickness>=3) armorBlock=approx(1.5*this.damage)
				resultingDamage-=armorBlock
				if(resultingDamage<0) resultingDamage=0
				if(this.effect.quickness>=5) resultingDamage=approx(resultingDamage/2)
				if(this.effect.quickness>=7) resultingDamage=0
			}
			if(this.name==="!Runner!" && fight.mob.length>1) resultingDamage-=approx(0.7*resultingDamage)
			if(this.name!=="Sponge") {
				for(let i=1;i<=4;i++) if(this.y+dy[i]>=1 && this.y+dy[i]<=3) {
					for(let j=0;j<fight.mob.length;j++) if(fight.mob[j].name==="Sponge" && fight.mob[j].x===this.x+dx[i] && fight.mob[j].y===this.y+dy[i]) {
						let absorption=Math.min(betterFloor(resultingDamage/2),fight.mob[j].currenthealth-1)
						if(absorption) {
							fight.mob[j].injure(absorption,"Absorption")
							resultingDamage-=absorption
						}
						break
					}
				}
			}
			if(MobAttributeList[this.id].match("Connected")!==null) {
				let totalConnect=0
				for(let i=0;i<fight.mob.length;i++) if(MobAttributeList[fight.mob[i].id].match("Connected")!==null) totalConnect++
				resultingDamage=approx(resultingDamage/totalConnect)
				for(let i=fight.mob.length-1;i>=0;i--) if(MobAttributeList[fight.mob[i].id].match("Connected")!==null) {
					fight.mob[i].injure(resultingDamage,"Psyonic Connection")
				}
				resultingDamage=0
			}
			if(isPetal(petal) && fight.turn!=="Mob" && MobAttributeList[this.id].match("BOSS")!==null) {
				if(!this.effect.hasOwnProperty("quickness")) this.effect.quickness=0
				this.effect.quickness++
			}
			if(resultingDamage) {
				addLog("[Mob] "+translateText(this.name)+translateText(" received ")+translateText(petalName,"CH")+translateText("造成的","CH")+resultingDamage+translateText("伤害","CH")+translateText(" damage from ","EN")+translateText(petalName,"EN")+translateText("."),"#bfbf00")
				this.currenthealth-=resultingDamage
			}
			if(petalName==="Stinger" && this.currenthealth<petal.damage) {
				addLog("[Mob] "+translateText(this.name)+translateText(" is executed."),"#bfbf00")
				this.currenthealth=0
			}
			this.print()
			if(this.currenthealth<=0) this.remove()
		}
		Mob.prototype.knockback=function(knockback) {
			if(this.currenthealth<=0 && this.count<=1) return
			if(this.name.match("(Missile)")!==null) return
			if(MobAttributeList[this.id].match("Immunes knockback")!==null) return
			let resultingKnockback=knockback
			if(resultingKnockback>this.actionbar+50) resultingKnockback=this.actionbar+50
			if(resultingKnockback) {
				addLog("[Mob] "+translateText(this.name)+translateText(" received ")+resultingKnockback+translateText(" knockback."),"#bfbf00")
				this.actionbar-=resultingKnockback
			}
			this.print()
		}
		Mob.prototype.progress=function(value) {
			if(this.name==="Roach") {
				let pendingSpeed=approx((this.currenthealth/this.health+1)/2*this.speed)
				if(pendingSpeed<this.speed) {
					this.effect.slowness=this.speed-pendingSpeed
				} else {
					delete this.effect.slowness
				}
			}
			let pendingAction=this.speed,maxAction=250
			if(value) {
				pendingAction=value
			} else {
				if(this.effect.hasOwnProperty("tardiness")) {
					if(pendingAction>10) pendingAction=approx((pendingAction*10)**0.5)
					this.effect.tardiness--
					if(!this.effect.tardiness) delete this.effect.tardiness
				}
				if(this.effect.hasOwnProperty("debilitation")) {
					pendingAction=approx(pendingAction/2)
					this.effect.debilitation--
					if(!this.effect.debilitation) delete this.effect.debilitation
				}
			}
			if(this.effect.hasOwnProperty("slowness")) pendingAction-=this.effect.slowness
			if(this.effect.hasOwnProperty("quickness")) pendingAction+=this.speed/5*this.effect.quickness
			if(this.effect.hasOwnProperty("restraint")) {
				if(MobAttributeList[this.id].match("BOSS")===null) {
					pendingAction=approx(pendingAction/2)
				} else {
					pendingAction=approx(pendingAction*0.75)
				}
				this.effect.restraint--
				if(!this.effect.restraint) delete this.effect.restraint
			}
			this.actionbar+=pendingAction
			if(this.actionbar>=maxAction) this.actionbar=maxAction
			this.print()
		}

							fight.spawnmob.push(new Mob("Bubble",2,0,false))
							fight.spawnmob[0].effect.immunity=2
							fight.spawnmob[0].actionbar=150
							fight.spawnmob.push(new Mob("Bubble",3,0,false))
							fight.spawnmob[1].effect.immunity=4
							fight.spawnmob[1].actionbar=100
							fight.spawnmob.push(new Mob("Bubble",3,0,false))
							fight.spawnmob[2].effect.immunity=6
							fight.spawnmob[2].actionbar=50
							fight.spawnmob.push(new Mob("Bubble",4,0,false))
							fight.spawnmob[3].effect.immunity=8
							fight.spawnmob.push(new Mob("Bubble",4,0,false))
							fight.spawnmob[4].effect.immunity=8
							fight.spawnmob.push(new Mob("Starfish",2,0))
							fight.spawnmob.push(new Mob("Sponge",2,0))
							fight.spawnmob.push(new Mob("Starfish",3,0))
							fight.spawnmob.push(new Mob("Sponge",3,0))
							fillMob()
							if(!this.effect.noloot) {
								addLog("[Resource] "+translateText("You received ")+1+translateText(" small vial of Bubble Essence."),"#7fff7f")
								player.item.add("Bubble Essence",1)
							}
						}
					} else if(this.effect.hasOwnProperty("runretreat")) {
						this.effect.runretreat--
						if(this.effect.runretreat===0) {
							delete this.effect.runretreat
							if(fight.mob.length>1) {
								this.effect.noloot=true
								this.currenthealth=0
								await this.remove()
								endFight()
								return
							}
							this.health-=approx(0.3*this.health)
							this.currenthealth-=approx(0.3*this.currenthealth)
							this.effect.runflee=40
							this.effect.counterweb=[3,8,15]
							fight.spawnmob.push(new Mob("Crab",3,0))
							fight.spawnmob.push(new Mob("Crab",3,0))
							fight.spawnmob.push(new Mob("Crab",4,0))
							fight.spawnmob.push(new Mob("Crab",4,0))
							fillMob()
							for(let i=0;i<fight.petal.length;i++) if(fight.petal[i].state==="Existing" && fight.petal[i].y>0 && fight.petal[i].speed>=100) {
								fight.petal[i].injure({effectturn:79},"Restraint")
							}
						}
					} else if(this.effect.hasOwnProperty("runflee")) {
						this.effect.runflee--
						if(this.effect.runflee===0) {
							delete this.effect.runflee
							if(fight.mob.length>1) {
								this.effect.noloot=true
								this.currenthealth=0
								await this.remove()
								endFight()
								return
							}
							this.health-=approx(0.3*this.health)
							this.currenthealth-=approx(0.3*this.currenthealth)
							this.effect.runrout=10
							spawnNear(new Mob("Sponge",4,0),this.x,this.y)
							spawnNear(new Mob("Sponge",3,0),this.x,this.y)
							spawnNear(new Mob("Sponge",2,0),this.x,this.y)
							spawnNear(new Mob("Sponge",1,0),this.x,this.y)
							if(!this.effect.noloot) {
								addLog("[Resource] "+translateText("You received ")+1+translateText(" small vial of Bubble Essence."),"#7fff7f")
								player.item.add("Bubble Essence",1)
							}
						}
					} else if(this.effect.hasOwnProperty("runrout")) {
						this.effect.runrout--
						if(this.effect.runrout===0) {
							delete this.effect.runrout
							this.effect.counterlight=2
						}
					}
				}
			} else if(this.behavior==="Neutral+" || this.behavior==="Hostile") {
				this.attack()
			}
			await waitConfirmation()
			if(this.currenthealth<=0 && this.count<=1) return
			await waitAnimation()
			missileCheck()
			await waitMissile()
			if(MobAttributeList[this.id].match("Doesn't move")===null) {
				let moveflag=true
				if(this.name==="!Hornet!" && this.calculate>=3) {
					moveflag=false
					for(let i=0;i<fight.petal.length;i++) if(fight.petal[i].state==="Existing" && fight.petal[i].y>0) {
						fight.petal[i].injure(approx(0.2*this.damage),"Barrage")
					}
					flowerInjure(approx(0.2*this.damage),"Barrage")
					this.calculate=0
				}
				if(this.name==="!Wasp!" && this.calculate>=2) {
					moveflag=false
					for(let i=0;i<fight.petal.length;i++) if(fight.petal[i].state==="Existing" && fight.petal[i].y>0) {
						fight.petal[i].injure(approx(0.2*this.damage),"Barrage")
					}
					flowerInjure(approx(0.2*this.damage),"Barrage")
					this.calculate=0
				}
				if(moveflag) this.move()
			}
			if(MobAttributeList[this.id].match("BOSS")!==null) {
				delete this.effect.quickness
			}
			updateT()
		}
		Mob.prototype.move=function(dir) {
			if(MobAttributeList[this.id].match("Doesn't move")!==null) return
			if(dir!==undefined) {
				if(fight.rift.open && ((this.x===fight.rift.x && this.y===fight.rift.y) || (toCord(this.x+dx[dir])===fight.rift.x && this.y+dy[dir]===fight.rift.y))) {
					fight.riftmob.push(this.clone())
					this.effect.noloot=true
					this.doom()
					return
				}
				if(this.y+dy[dir]>=1 && this.y+dy[dir]<=3 && !getFilledGrid(toCord(this.x+dx[dir]),this.y+dy[dir])) {
					getGrid(0,this.x,this.y).replaceWith(createGrid(0,this.x,this.y,"Empty",1,0))
					this.x=toCord(this.x+dx[dir])
					this.y=toCord(this.y+dy[dir])
					this.print()
				}
				return
			}
			let pendingCord=new Array(),distanceLimit=1,originX=this.x,originY=this.y
			pendingCord.push({x:originX,y:originY})
			if(MobAttributeList[this.id].match(/(?<=Moves up to )\d/)!==null) distanceLimit=parseInt(MobAttributeList[this.id].match(/(?<=Moves up to )\d/))
			for(let i=1;i<=8;i++) for(let j=1;j<=3;j++) if(discalc(i,this.x)+discalc(j,this.y,0)<=distanceLimit && !getFilledGrid(i,j)) pendingCord.push({x:i,y:j})
			let resultingCord=pendingCord[roll(0,pendingCord.length-1)]
			if(this.x===resultingCord.x && this.y===resultingCord.y) return
			if(fight.rift.open && ((this.x===fight.rift.x && this.y===fight.rift.y) || (resultingCord.x===fight.rift.x && resultingCord.y===fight.rift.y))) {
				fight.riftmob.push(this.clone())
				this.effect.noloot=true
				this.doom()
				return
			}
			getGrid(0,this.x,this.y).replaceWith(createGrid(0,this.x,this.y,"Empty",1,0))
			this.x=resultingCord.x
			this.y=resultingCord.y
			this.print()
			if(this.name==="Baby Ant" && this.y===originY+1 && this.y>=3) {
				this.attack()
			}
			if(this.name==="Sandstorm" && this.y===originY+1 && this.y>=2) {
				this.attack()
			}
			if(this.name==="Baby Fire Ant" && this.y===originY+1 && this.y>=3) {
				this.attack()
			}
			if(this.name==="Baby Termite" && this.y===originY+1 && this.y>=3) {
				this.attack()
			}
		}
		Mob.prototype.attack=async function() {
			if(this.name.match("(Missile)")===null) {
				addLog("[Mob] "+translateText("Attack of ","EN")+translateText(this.name)+translateText("的攻击","CH")+"...","#bfbf00")
				fight.mobattack=true
				confirmation=true
			} else {
				addLog("[Mob] "+translateText(this.origin.name)+translateText(" shoots a missile."),"#bfbf00")
			}
			let attackFlag=true
			if(this.name==="Beetle" && checkBossAlive("Summoner")) {
				for(let i=0;i<fight.mob.length;i++) if(fight.mob[i].name==="Beetle" && determine(20,true," for level up")) {
					addLog("[Mob] "+translateText("Beetle")+translateText(" gets 1 level up."),"#bfbf00")
					if(!fight.mob[i].effect.hasOwnProperty("levelup")) fight.mob[i].effect.levelup=0
					fight.mob[i].effect.levelup++
				}
			}
			if(checkBossAlive("Summoner+")) {
				for(let i=0;i<fight.mob.length;i++) if(fight.mob[i].name!=="!Summoner+!" && determine(30,true," for level up")) {
					addLog("[Mob] "+translateText(fight.mob[i].name)+translateText(" gets 1 level up."),"#bfbf00")
					if(!fight.mob[i].effect.hasOwnProperty("levelup")) fight.mob[i].effect.levelup=0
					fight.mob[i].effect.levelup++
				}
			}
			if(this.name.match("(Missile)")===null && MobAttributeList[this.id].match("ATTACK")!==null) {
				attackFlag=false
				if(this.name==="Cactus") {
					flowerInjure(this.damage,this)
				}
				if(this.name==="Hornet") {
					let shootingMissile=this.clone()
					shootingMissile.origin=this
					shootingMissile.name+=" (Missile)"
					shootingMissile.damage=approx(shootingMissile.damage/5)
					shootingMissile.dodge=20
					fight.missile.push(shootingMissile)
				}
				if(this.name==="Scorpion") {
					let shootingMissile=this.clone()
					shootingMissile.origin=this
					shootingMissile.name+=" (Missile)"
					shootingMissile.damage=approx(shootingMissile.damage/3)
					shootingMissile.dodge=30
					fight.missile.push(shootingMissile)
				}
				if(this.name==="Jellyfish") {
					flowerInjure(approx(0.4*this.damage),"Lightning")
				}
				if(this.name==="Leech") {
					flowerInjure(approx(0.5*this.damage),this)
				}
				if(this.name==="Mantis") for(let i=1;i<=3;i++) {
					let shootingMissile=this.clone()
					shootingMissile.origin=this
					shootingMissile.name+=" (Missile)"
					shootingMissile.damage=1
					shootingMissile.dodge=10
					fight.missile.push(shootingMissile)
				}
				if(this.name==="Beetle (Hell)") {
					if(this.effect.charge) {
						addLog("[Mob] "+translateText("Beetle (Hell)")+translateText(" uses charged attack."),"#bfbf00")
						delete this.effect.charge
						flowerInjure(this.damage,this)
					} else {
						attackFlag=true
					}
				}
				if(this.name==="Wasp") {
					let shootingRepeat=roll(1,2)
					for(let i=1;i<=shootingRepeat;i++) {
						let shootingMissile=this.clone()
						shootingMissile.origin=this
						shootingMissile.name+=" (Missile)"
						shootingMissile.damage=approx(shootingMissile.damage/5)
						shootingMissile.dodge=20
						fight.missile.push(shootingMissile)
					}
				}
				if(this.name==="Wasp (Hell)") for(let i=1;i<=5;i++) {
					let shootingMissile=this.clone()
					shootingMissile.origin=this
					shootingMissile.name+=" (Missile)"
					shootingMissile.damage=approx(shootingMissile.damage/10)
					shootingMissile.dodge=10
					fight.missile.push(shootingMissile)
				}
				if(this.name==="!Hornet!") for(let i=1;i<=3;i++) {
					let shootingMissile=this.clone()
					shootingMissile.origin=this
					shootingMissile.name+=" (Missile)"
					shootingMissile.damage=approx(0.4*shootingMissile.damage)
					shootingMissile.dodge=40
					fight.missile.push(shootingMissile)
				}
				if(this.name==="!Dandelion!") for(let i=1;i<=8;i++) {
					let shootingMissile=this.clone()
					shootingMissile.origin=this
					shootingMissile.name+=" (Missile)"
					shootingMissile.damage=approx(0.2*shootingMissile.damage)
					shootingMissile.dodge=70-10*this.count-10*betterFloor((i-1)/2)
					fight.missile.push(shootingMissile)
				}
				if(this.name==="!Scorpion!") {
					let shootingMissile=this.clone()
					shootingMissile.origin=this
					shootingMissile.name+=" (Missile)"
					shootingMissile.damage=approx(shootingMissile.damage/5)
					shootingMissile.dodge=80
					fight.missile.push(shootingMissile)
				}
				if(this.name==="!Shell!") {
					if(this.effect.pearl>=5) {
						for(let i=1;i<=this.effect.pearl;i++) {
							let shootingMissile=this.clone()
							shootingMissile.origin=this
							shootingMissile.name+=" (Missile)"
							shootingMissile.dodge=40
							fight.missile.push(shootingMissile)
						}
						delete this.effect.pearl
					} else {
						attackFlag=true
					}
				}
				if(this.name==="!Leech!") {
					flowerInjure(this.damage,this)
					if(!this.effect.origindamage) this.effect.origindamage=this.damage
					let buffEffectiveness=20
					if(this.effect.hasOwnProperty("suppression")) buffEffectiveness-=2*this.effect.suppression.turn
					if(buffEffectiveness>0) this.damage+=approx(this.effect.origindamage*buffEffectiveness/100)
				}
				if(this.name==="!Mantis!") for(let i=1;i<=5;i++) {
					let shootingMissile=this.clone()
					shootingMissile.origin=this
					shootingMissile.name+=" (Missile)"
					shootingMissile.damage=approx(shootingMissile.damage/5)
					shootingMissile.dodge=20
					fight.missile.push(shootingMissile)
				}
				if(this.name==="!Wasp!") for(let i=1;i<=3;i++) {
					let shootingMissile=this.clone()
					shootingMissile.origin=this
					shootingMissile.name+=" (Missile)"
					shootingMissile.damage=approx(0.4*shootingMissile.damage)
					shootingMissile.dodge=20
					fight.missile.push(shootingMissile)
				}
				if(this.name==="!Pelle!") {
					this.damage=approx(1.05*this.damage)
					attackFlag=true
				}
			}
			if(attackFlag) {
				if(this.name.match("(Missile)")===null) getGrid(0,this.x,this.y).children[1].style.transform="rotate(180deg)"
				confirmation2=true
				operPrepare(this,"Defend")
				updateT()
				await waitConfirmation2()
			}
			if(this.name.match("(Missile)")===null) {
				fight.mobattack=false
				confirmation=false
				updateT()
			}
			if(this.name.match("(Missile)")!==null) missileCheck()
		}
	</script>
	<script>
		const bookHTML=new Object()
		bookHTML["Flower Artisan Guide"]="<h2>Flower Artisan Guide</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>Combine or refine common petals into powerful new forms. By combining different petals with similar characteristics, you gain stronger one improved in level, giving stronger damaging attributes. By refining petal with high level, you gain stronger one improved in rarity, guaranting better durability and wear resistance. Be proficient in the two production methods, and you can easily overwhelm your opponents during battles. This book is your guide to mastering the art of petal craft.</span><br><span>For Rarity Up, you only need to select 1 petal with positive Level (and Rarity should not be Mythic). Higher Level increases the success chance and higher Rarity decreases the chance. The chance is always 100% for petal with at least 3 Level. However, you may find it not worth in some cases. Higher rarity grants your petal higher Health but Damage might be significant decreased since <span class='bold'>Rarity Up resets Level</span>.</span><br><span>For Level Up, you need to select at least 2 petals of the same type with identical Rarity and Level. The success chance decreases as Rarity and Level increases, and the decay stops after 3 Level. To increase the success chance, you need to put more petals at once. (X+1) petals grants you X times success chance. However, success chance exceeds 100% does nothing, and you lost all petals when success or lost [1,X] petals when fail, so putting all petals together is not a wise decision.</span><br><span>Before you begin, there's one more thing to remind you: The Base Four Influencing Fators (Speed, Reload, ATKBuff, DEFBuff) is <span class='bold'>kept</span> on Rarity Up. On Level Up, they <span class='bold'>independently inherit</span> from one material. Choose your materials wisely! Here is another multifunctional calculator which is quite convenient to use by simply inputting Rarity and Level. 3 0 or 4 2 for example.</span><input type='text' tabindex='-1' id='craft-detail' onkeydown='craftdetail(event.key)' class='inner-input' list='craftdetaillist' autocomplete='off' title='Craft Detail'><datalist id='craftdetaillist'><option value='3 0'><option value='4 2'></datalist>"
		bookHTML["Flower Combat Guide"]="<h2>Flower Combat Guide</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>When you enter a map for the first time, mobs will be spawned and fight against you. There is a threshold depends on Floor that prevents too many mobs existing at the same time. Therefore, when you defeat a mob, a new mob may spawn.</span><br><span>The process of a round in battle is divided into the following parts: At the beginning, your petals gain action based on speed. You can move petals, use them for attack or perform special skills. Then mobs gain action. Mob with action exceeding the threshold will attack and you use petal to defend. If you skip defend or the defend fails, you take the damage. By default value, moving a petal costs 100 action, while using a petal to attack costs 200 action. The threshold for mob is 200 action.</span><br><span>Your petals can attack or defend mobs from <span class='bold'>the front or the side column</span>. The success rate of attack is based on petal ATK (atk2 for front row and atk1 for middle row) and mob Dodge. The success rate of defend is based on petal DEF (def2 for back row and def1 for middle row) and mob Dodge. These two formula have significant difference. When the mob is from side column, the formula also uses petal Size. Petal Size is capped at 20, but the best value for side-defending is <span class='bold'>17 to 18 Size</span>.</span><br><span>For shootable petal, before any bounces, the Accuracy (the petal ATK in success rate formula for shootable petals) is always 100% inside range. For each distance exceeds range, the Accuracy is decreased by Accuracy Decline. If it hits the target, it can bounce between enemies. The Accuracy is decreased by Repeated Accuracy Decline each time it targets a enemy that already hit. The Accuracy is decreased by Bounce Accuracy Decline each bounce exceeds Bounce. Any bounce hits can only hit enemy within Bounce Range.</span><br><span>Since you are facing mobs from all directions and not only from the front, <span class='bold'>the first and last columns are connected</span>, which means that both your petals and mobs can move from the first column to the last column or inverted, and the first and last columns are side columns to each other. The distance between two grids is calculated by horizontal distance plus vertical distance <span class='bold'>without using the Pythagorean theorem</span>. The word 'Retire' means a petal disappears and can't be used again in the same fight. If you are defeated, you only have 30% probability to temporary keep loot and they could be lost if you are defeated again in the same map.</span><br><span>You can calculate chance in the following box. For example, Aa-48S12 calculates the success rate of attacking 80% Dodge mob in side column with 12 Size, 100% ATK and -4 ATKbuff petal, A4+a6F calculates the success rate of attacking 60% Dodge mob in the front column with 40% ATK and +10 ATKbuff petal, D3+05F calculates the success rate of defending 50% Dodge mob in the front column with 30% DEF and +0 DEFbuff petal.</span><input type='text' tabindex='-1' id='combat-calc' onkeydown='combatcalc(event.key)' class='inner-input' list='calclist' autocomplete='off' title='Calculator'><datalist id='calclist'><option value='Aa-48S12'><option value='A4+a6F'><option value='D3+05F'></datalist>"
		bookHTML["Flower Control Guide"]="<h2>Flower Control Guide</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><h3>Hot Keys</h3><div class='green-bg inner-box'><span style='color: #7f7f7f'>S: Open/Close settings</span><span style='color: #7f7f7f'>H: Open/Close help</span><span style='color: #7f7f7f'>Z: Open/Close inventory</span><span style='color: #7f7f7f'>V: Open/Close gallery</span><br><span style='color: #9f9f00'>W=↑: Move up</span><span style='color: #9f9f00'>D=→: Move right</span><span style='color: #9f9f00'>S=↓: Move down</span><span style='color: #9f9f00'>A=←: Move left</span><br><span style='color: #009f9f'>T: End turn (mostly)</span><span style='color: #009f9f'>M: Move</span><span style='color: #009f9f'>R: Attack</span><span style='color: #009f9f'>X: Special actions</span><br><span style='color: #ffffff'>Enter: Confirm</span><span style='color: #ffffff'>Backspace: Cancel</span></div>"
		bookHTML["Flower Debate Guide"]="<h2 style='color: #7eef6d'>Flower Debate Guide</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>Floor 1 Game: Debate Strategy.</span><span>Reward: Various good things, including talent system.</span><span class='bold'>To activate talent system, you must complete the relevant tier within Floor 1.</span><br><br><span>At the beginning, you and your opponent have the same Momentum. When one's Momentum drops to zero, the opponent win. You will receive rewards only when winning for the first time. There are <span class='bold'>no punishment</span> after failure, and attempts is not limited.</span><br><span>There are 4 types of basic cards: Rock(25%), Blood Stinger(25%), Dice(25%), Air(10%). Basic cards have random rarities from Common to Epic, and levels from 0 to 3. They are petals without attribute floating. If you get a high quality card and don't have any petals of that quality, the level will be reduced until you have a petal at same quality. If there is still no same quality petal after level reduced to 0, rarity will also be reduced.</span><br><span>There are 4 types of advanced cards: Yggdrasil(2%), Criticize(6%), Disregard(6%), Refresh(1%). The rarities of advanced cards are fixed at Legendary, and levels are fixed at 0. Each player has 6 cards.</span><br><span>There are 5 topics: Health(25%), Damage(25%), DPT(25%), Special(20%), Scarce(5%). For each topic, both players choose a card and compare. The loser will get Momentum reduced by 1. Then, both players draw a new card and start a new topic. Each topic has <span class='bold'>different judgments</span>:</span><span>1. Health Petals: If both player use basic cards, the one with higher health wins.</span><span>2. Damage Petals: If both player use basic cards, the one with higher damage wins. Blood stinger's damage is considered twice as much.</span><span>3. DPT Petals: If both player use basic cards, the one with higher DPT wins. Dice's DPT is considered 6 times as much. Rock is considered as it can hit twice.</span><span>4. Special Petals: If both player use basic cards, the one uses Air wins.</span><span>5. Scarce Petals: If both player use basic cards, no one wins.</span><br><span>Yggdrasil: It is considered as basic cards in topic 1~3. In topic 4~5 it wins all previous cards. In topic 5, it will also cause the opponent to lose an <span class='bold'>additional 2 Momentum</span> when win.</span><span>Criticize: It wins all previous cards in all topics.</span><span>Disregard: It wins all previous cards in all topics. However, the loser will keep the Momentum.</span><span>Refresh: It wins all previous cards in all topics. However, the loser will keep the Momentum. Instead, the winner discards all cards and draws new cards.</span><br><span>You can see the rarity of your opponent's card. And your attention is amazing, with a 20% chance of recognize when your opponent gains or moves Air.</span>"
		bookHTML["Flower Design Guide"]="<h2 style='color: #ffe65d; filter: brightness(90%); pointer-events: none'>Flower Design Guide</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>Floor 2 Game: Dressing Technique.</span><span>Reward: Some good things. There are rewards for getting 75 score in Meta, and more for complete Meta.</span><span class='bold'>You can unlock stage only in Floor 2.</span><br><br><span>This game has 5 stages: 4 normal stages and a Meta stage. For each stage, there are 4 <span class='bold'>independent</span> rules. Your goal is to find all these rules, and get full score to complete a stage. You can submit a build with <span class='bold'>6 petals</span> to attempt, different stages will show different informations based on the specific rule. You will receive rewards only when completing Meta stage. The other 4 stages have no reward except clues for Meta. There are <span class='bold'>no punishment</span> after attempt, but you can not submit twice in same stage and same day.</span><br><span>To unlock a stage or get a hint, you need an <span class='bold'>invitation letter</span>. They can be found by searching carefully in different spots outside. Totally, there are 12 invitation letters in Garden, 8 invitation letters in Jungle, and 2 for each other region.</span>"
		bookHTML["Flower Environmental Guide"]="<h2 style='color: #ffe65d; filter: brightness(90%); pointer-events: none'>Flower Environmental Guide</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>From now on, the surrounding environment is starting to change and will become <span class='bold'>even worse</span>. Flowers that are not adapted to the environment will face layers of obstacles on their journey, while the mobs that inhabit here can easily cope and even use the environment to strengthen themselves, which will be a huge challenge. The environment are closely related to the region which the map is located. On the way ahead, you should pay attention to changes in the environment and be well prepared. Here are some information related to the environment.</span>"
		bookHTML["Flower Evolutionary Guide"]="<h2>Flower Evolutionary Guide</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>Consume the petals to absorb their vital essence. This raw energy fuels your growth, allowing you to level up and evolve. With each infusion of experience, you grow stronger, gain access to higher tier abilities, naturally ascending to greater heights. This ancient cycle of growth is detailed within these pages.</span><br><span>You gain petals from defeated mobs, higher rarity mobs drops better loots. Different mobs drops various petals, with droprate from tier 1 to tier 5. You can see the detail in gallery. The base Experience for a petal is <span class='bold'>(RarityFactor)*(Level+1)</span>. For Common, Unusual, Rare, Epic, Legendary, Mythic Petals, the Factors are 8, 12, 20, 40, 100, 300 respectively. Then, the Experience is multiplied by a random value from 0.8 to 1.2, and rounded to nearest integer, so the expected Experience is equivalent to base Experience.</span><br><span>Since this mechanic is not difficult to understand, you need no calculator for this. I provided another calculator here which helps you get the basic stat of petals. Your gained petals have 20% basic stat attribute floating <span class='bold'>except some special kinds</span>. To use this box, you just need to simply input Name, Rarity, Level. For example, Corn 3 0 calculates the stat of Rare Corn, Plank 4 2 calculates the stat of Epic Plank++.</span><input type='text' tabindex='-1' id='petal-stat' onkeydown='petalstat(event.key)' class='inner-input' list='petalstatlist' autocomplete='off' title='Petal Stat'><datalist id='petalstatlist'><option value='Corn 3 0'><option value='Plank 4 2'></datalist>"
		bookHTML["Flower Game Guide"]="<h2>Flower Game Guide <span style='color: #0078d7; font-style: italic; font-size: 12px; font-weight: noremal'>//TODO</span></h2><div class='white-bg inner-box'><span style='color: #008000'>#include&lt;PFLFtools.h&gt; <span style='color: #0078d7; font-style: italic;'>//should be replaced</span></span><span style='color: #008000'>#include&lt;iostream&gt;</span><span style='color: #008000'>#include&lt;time.h&gt;</span><span style='color: #008000'>#include&lt;math.h&gt;</span><span style='color: #008000'>#include&lt;string.h&gt;</span><span style='color: #008000'>#include&lt;fstream.h&gt;</span><span><span style='font-weight: bold'>using namespace</span> std<span style='color: #ff0000; font-weight: bold'>;</span></span><span><span style='font-weight: bold'>void</span> menu<span style='color: #ff0000; font-weight: bold'>()</span></span><span style='color: #ff0000; font-weight: bold'>{</span><span style='margin-left: 2em'>system<span style='color: #ff0000; font-weight: bold'>(</span><span style='color: #0000ff; font-weight: bold'>\"cls\"</span><span style='color: #ff0000; font-weight: bold'>);</span></span><span style='margin-left: 2em'>slowprint<span style='color: #ff0000; font-weight: bold'>(</span><span style='color: #0000ff; font-weight: bold'>\"↓MORE GAME (CLICK!)↓\"</span><span style='color: #ff0000; font-weight: bold'>,</span><span style='color: #800080'>50</span><span style='color: #ff0000; font-weight: bold'>);</span></span><span style='margin-left: 2em'>slowprint<span style='color: #ff0000; font-weight: bold'>(</span><a href='https://6triple6single.github.io/PFLF' target='_blank' style='color: #0000ff; font-weight: bold; text-decoration: none'>\"PFLF\"</a><span style='color: #ff0000; font-weight: bold'>,</span><span style='color: #800080'>50</span><span style='color: #ff0000; font-weight: bold'>);</span></span><span style='margin-left: 2em'>slowprint<span style='color: #ff0000; font-weight: bold'>(</span><a href='https://6triple6single.github.io/Virus1' target='_blank' style='color: #0000ff; font-weight: bold; text-decoration: none'>\"VIRUS 1\"</a><span style='color: #ff0000; font-weight: bold'>,</span><span style='color: #800080'>50</span><span style='color: #ff0000; font-weight: bold'>);</span></span><span style='margin-left: 2em'><span style='font-weight: bold'>return</span><span style='color: #ff0000; font-weight: bold'>;</span></span><span style='color: #ff0000; font-weight: bold'>}</span><span><span style='font-weight: bold'>int</span> main<span style='color: #ff0000; font-weight: bold'>()</span></span><span style='color: #ff0000; font-weight: bold'>{</span><span style='margin-left: 2em'>system<span style='color: #ff0000; font-weight: bold'>(</span><span style='color: #0000ff; font-weight: bold'>\"cls\"</span><span style='color: #ff0000; font-weight: bold'>);</span></span><span style='margin-left: 2em'>Sleep<span style='color: #ff0000; font-weight: bold'>(</span><span style='color: #800080'>2000</span><span style='color: #ff0000; font-weight: bold'>);</span></span><span style='color: #0078d7; font-style: italic; margin-left: 2em'>// loadtext();</span><span style='color: #0078d7; font-style: italic; margin-left: 2em'>// loadgallery();</span><span style='color: #0078d7; font-style: italic; margin-left: 2em'>// loadmarvel();</span><span style='margin-left: 2em'>menu<span style='color: #ff0000; font-weight: bold'>();</span></span><span style='margin-left: 2em'><span style='font-weight: bold'>return</span> <span style='color: #800080'>0</span><span style='color: #ff0000; font-weight: bold'>;</span></span><span style='color: #ff0000; font-weight: bold'>}</span></div>"
		bookHTML["Flower Subsist Guide"]="<h2 style='color: #7eef6d'>Flower Subsist Guide</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>In this long journey, it is inevitable to feel bored and tired, Traveler. You need enough time to strengthen yourself and travel towards higher places. But time won't wait for you. If you don't speed up, you will be greeted by the collapse of Florroom.</span><br><span>And you have realized that things are far more than that, your energy has started to drain slowly but steadily. The cyan vertical bar on the left represents your energy, the lower the energy, the weaker you will be. The upper limit of energy is 100%, and the lower limit is 36%. Never try to cross the <span class='bold'>64%</span> safe line, it will only accelerate your death.</span><br><span>Let's be more specific about the effects of energy on combat. As energy is lost, your petals lose more Health when hit, increased to 1/Energy of the original value. Your petals cause lower damage to mobs, which is multiplied by Energy. After crossing the safety line, the flower will receive higher damage, multiplied by 0.3/(Energy-35%). Petals also receive fewer action bars, which is (Energy-35%)/0.3 times the speed.</span><br><span>You should strive to maintain sufficient energy to enter the next floor, where you will receive a 6% energy recovery. Do not waste any items that provide energy recovery, as these tools are extremely scarce and crucial for your survival. To avoid losing too much energy, you need to always remember the following two things:</span><span>1. Don't spend too much turns in battle, as each turn will cause you to lose 0.01% Energy.</span><span>2. Defend mob attacks as much as possible, as each injury will cause you to lose 0.03% Energy.</span><br><span>That's all. Good luck.</span>"
		bookHTML["Flower Survival Guide"]="<h2>Flower Survival Guide</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>Welcome to the Florroom! This is a tower with 8 floors. As something you may not be familiar with, the goal of the game is to climb from Floor 0 (the bottom) to Floor 7. Here, you make powerful petals, travel between different regions and maps, defeat various mobs and continuously upgrade to gain stronger power!</span><br><span>This is your first book. As the story continues, you will learn more knowledge, which appears in the form of books in this section. If you don't have experience fighting in Florroom, it doesn't matter. You are able to get <span class='bold'>Flower Combat Guide</span> and <span class='bold'>Flower Terminology Guide</span> I wrote. Enter the name of this book below to get it!</span><br><span>If you remembered something, try writing in the following box to retrieve the corresponding item:</span><input type='text' tabindex='-1' id='item-code' onkeydown='itemcode(event.key)' class='inner-input' autocomplete='off' title='Code'><span>(NOt CASe SenSItiVE &amp; ign o r i ngspace s)</span>"
		bookHTML["Flower Talent Guide"]="<h2 style='color: #7eef6d'>Flower Talent Guide</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>Reawaken the potential power you lost. As you have reactivated your talent, you can enhance your various innate abilities by investing in talent points obtained through leveling up. Beware, the path is not fixed. You may respec your choices and retrieve your talent points, but with each reshaping there will be <span class='bold'>a growing cost</span>. Please think twice before starting.</span><br><span>Common talents unlock at level 5, each costing 2TP. Rare talents unlock at level 10, each costing 3TP. Mythic talents unlock at level 15, each costing 5TP. Purchase STA1~3 to start. You can purchase nodes connected with branches, which are colored yellow. There are \"-XTP\" nodes that connect similar talents, allowing you to spend less TP when studying both together. For example, purchasing TRE1~5 with THR1~5 requires 20TP, while purchasing TRE1~5, -5TP and THR5 only requires 17TP. Note that <span class='bold'>only highest level</span> of a specified talent is effective.</span>"
		bookHTML["Flower Terminology Guide"]="<h2>Flower Terminology Guide</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><h3>Rarity</h3><span style='color: #000000'>0=None</span><span style='color: #7eef6d'>1=Common</span><span style='color: #ffe65d'>2=Unusual</span><span style='color: #ffe65d; filter: brightness(90%)'>(2)=Unusual</span><span style='color: #4d52e3'>3=Rare</span><span style='color: #861fde'>4=Epic</span><span style='color: #de1f1f'>5=Legendary</span><span style='color: #1fdbde'>6=Mythic</span><span style='color: #ff2b75'>7=Ultra</span><span style='color: #2bffa3'>8=Super</span><span style='color: #2bffa3; filter: brightness(90%)'>(8)=Super</span><span style='color: #555555'>9=Unique</span><h3>Petal Stats</h3><span><span class='bold'>Health</span>: How much damage your petal can take before destroyed.</span><span><span class='bold'>Damage</span>: How much damage your petal can deal.</span><span><span class='bold'>Size</span>: Size is a number between 1 and 20, which affects side attack/defend accuracy. The effective ATK/DEF percentage is decreased by (18-size)(17-size)/2 in side attack/defend.</span><span><span class='bold'>Speed</span>: How much actionbar your petal gain each turn.</span><span><span class='bold'>Reload</span>: How much actionbar you need to reload petal.</span><span><span class='bold'>Actionbar</span>: Your petals gain actionbar when flower turn starts. Actionbar can be used to reload petal, move petal or attack with petal. Some petal skill costs actionbar.</span><span><span class='bold'>ATK</span>: The attack accuracy of petal. Only petal with positive ATK can be used to attack. ATK1 (before arrow) determines the attack accuracy in middle row, while ATK2 (after arrow) determines the attack accuracy in front row.</span><span><span class='bold'>DEF</span>: The defend accuracy of petal. Only petal with positive DEF can be used to defend. DEF1 (before arrow) determines the defend accuracy in middle row, while DEF2 (after arrow) determines the defend accuracy in back row.</span><span><span class='bold'>ATKbuff</span>: ATKbuff is a number between -10 and 10, which affects effective attack accuracy percentage. Petal with less than 5 ATKbuff will receive an extra nerf when attacking mobs in side column.</span><span><span class='bold'>DEFbuff</span>: DEFbuff is a number between -10 and 10, which affects effective defend accuracy percentage. Petal with less than 5 DEFbuff will receive an extra nerf when defending mobs in side column.</span><span><span class='bold'>Attribute Float</span>: The Health/Damage/Speed/Reload attribute of petal has 20%/20%/10%/10% floating value. The <span class='bold'>BEST/GOOD/AVG/WEAK/FAIL</span> determines how good the attribute is. Lower reload is better.</span><br><h3>Mob Stats</h3><span><span class='bold'>Passive</span>: The mob will not attack you by default.</span><span><span class='bold'>Neutral</span>: The mob will not attack you before receiving damage from petal. Most mobs also have chance to become hostile before action.</span><span><span class='bold'>Neutral+</span>: Neutral mob which became hostile.</span><span><span class='bold'>Hostile</span>: The mob will attack you when action.</span><span><span class='bold'>Health</span>: How much damage the mob can take before destroyed.</span><span><span class='bold'>Damage</span>: How much damage the mob can deal.</span><span><span class='bold'>Dodge</span>: The accuracy of mob, also reduces chance to be hit.</span><span><span class='bold'>Speed</span>: How much actionbar the mob gain each turn.</span><span><span class='bold'>Actionbar</span>: Mobs gain actionbar when mob turn starts. Mob action costs 200 actionbar.</span><br><h3>Petal Affix</h3><span><span class='bold'>Affix</span>: The properties or skills attached to petals. Only depends on petal kind.</span><span><span class='bold'>Type</span>: The petal can be equipped with one specific type, different types of same petal have different properties.</span><span><span class='bold'>Name</span>: The petal name for specific type.</span><span><span class='bold'>Decoration</span>: Decoration petals doesn't have entity. It can be equipped like items and can't move.</span><span><span class='bold'>Part</span>: The petal has multiple parts. Petal losts 1 part instead of destroyed when health reaches 0, exceeding damage is canceled.</span><span><span class='bold'>Petal attribute</span>: The inherent properties of petals. It may even affect petals in inventory.</span><span><span class='bold'>When equipped</span>: Special impact which only happens once at start of fight.</span><span><span class='bold'>While exist</span>: Persistent effect when the petal is reloaded.</span><span><span class='bold'>When attack</span>: The side effects of attack.</span><span><span class='bold'>When defend</span>: The side effects of defend.</span><span><span class='bold'>When attack or defend</span>: The side effects of both attack and defend.</span><span><span class='bold'>When shoot</span>: The petal is shootable. The detail is listed in Flower Combat Guide.</span><span><span class='bold'>Special skill</span>: The special skill of petal. Sometimes there are conditions to use, but costs no action by default.</span><span><span class='bold'>At start of turn</span>: The effects when flower turn starts.</span><span><span class='bold'>At end of turn</span>: The effects when flower turn ends.</span><span><span class='bold'>When destroyed a part</span>: Things will happen when a part of petal is destroyed except the last part.</span><span><span class='bold'>When destroyed</span>: Things will happen when a petal is fully destroyed. Attribute reset will reset some nerf/buff on petal by other affixes of the same petal.</span><span><span class='bold'>Retire</span>: Retired petal can't be used in the same fight.</span><br><span><span class='bold' style='color: #bf00bf; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>Poison</span>: The petal can deal poison damage, which is a special type of damage.</span><span><span class='bold' style='color: #7fffff; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>Lightning</span>: The petal can deal lightning damage, which is a special type of damage.</span><span>Sign of numerical values in affix: <span class='bold' style='color: #7fdf7f; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>Health</span>, <span class='bold' style='color: #ff7f7f; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>Damage</span>, <span class='bold' style='color: #00dfff; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>Rarity</span>, <span class='bold' style='color: #9f5fff; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>Level</span>, <span class='bold' style='color: #9f5f9f; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>Calculate value</span></span><br><h3>Mob Affix</h3><span><span class='bold'>Boss</span>: Boss mob gains quickness when receiving damage from petal. Quickness will be reset to 0 after action.</span><span><span class='bold'>Lives</span>: The mob has more than 1 live. Mob losts 1 live instead of destroyed when health reaches 0, exceeding damage is canceled. Also called <span class='bold'>part</span>.</span><span><span class='bold'>Mob attribute</span>: The inherent properties of mobs.</span><span><span class='bold'>At start of turn</span>: The effects when mob turn starts. Actionbar is not required.</span><span><span class='bold'>While exist</span>: Persistent effect when the mob is alive.</span><span><span class='bold'>Chance becoming hostile</span>: There is a chance for neutral mobs to become hostile (which means neutral+) before action.</span><span><span class='bold'>Mob action</span>: The mob may not use the default action.</span><span><span class='bold'>When attack</span>: The side effects of attack.</span><span><span class='bold'>Characteristic</span>: Something related to damage result.</span><span><span class='bold'>When destroyed a part</span>: Things will happen when a part of mob is destroyed except the last part.</span><span><span class='bold'>When destroyed</span>: Things will happen when a mob is fully destroyed.</span><span><span class='bold'>Retire</span>: Retired mob will be destroyed without loot.</span><br><span><span class='bold' style='color: #bf00bf; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>Poison</span>: The mob can deal poison damage, which is a special type of damage.</span><span><span class='bold' style='color: #7fffff; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>Lightning</span>: The mob can deal lightning damage, which is a special type of damage.</span><span>Sign of numerical values in affix: <span class='bold' style='color: #7fdf7f; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>Health</span>, <span class='bold' style='color: #ff7f7f; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>Damage</span>, <span class='bold' style='color: #9f5f9f; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>Calculate value</span>"

		function addLog(text,color="#000000") {
			if(text.startsWith("[Help]") && player.settings.closehelplog===true) return
			if(text.startsWith("[Command]") && player.settings.closecommandlog===true) return
			if(text.startsWith("[Chat]") && player.settings.closechatlog===true) return
			if(text.startsWith("[Warning]") && player.settings.closewarninglog===true) return
			if(text.startsWith("[Code]") && player.settings.closecodelog===true) return
			if(text.startsWith("[Calculator]") && player.settings.closecalculatorlog===true) return
			if(text.startsWith("[bot#7976]") && player.settings.closebotlog===true) return
			if(text.startsWith("[Petal]") && player.settings.closepetallog===true) return
			if(text.startsWith("[Mob]") && player.settings.closemoblog===true) return
			if(text.startsWith("[Flower]") && player.settings.closeflowerlog===true) return
			if(text.startsWith("[Turn]") && player.settings.closeturnlog===true) return
			if(text.startsWith("[Determine]") && player.settings.closedeterminelog===true) return
			if(text.startsWith("[Resource]") && player.settings.closeresourcelog===true) return
			if(text.startsWith("[Loot]") && player.settings.closelootlog===true) return
			if(text.startsWith("[Craft]") && player.settings.closecraftlog===true) return
			text=text.replace(/(?<=^\[).+?(?=\])/,(content)=>translateText(content))
			let logElement=document.createElement("div")
			logElement.setAttribute("class","lcmargin")
			if(color) logElement.style.color=color
			logElement.innerHTML=text
			document.getElementById("log").appendChild(logElement)
			document.getElementById("log").scrollTop=document.getElementById("log").scrollHeight
		}

		function command(key) {
			if(key!=="Enter") return
			if(logDisplay===false) return
			let commandInput=document.getElementById("command-call").value
			document.getElementById("command-call").value=""
			if(commandInput.startsWith(".")) {
				commandInput=commandInput.slice(1)

				if(commandInput==="help") {
					validCommand=true

						addLog("[Help] Help: Print list of all available commands. (Format: .help)","#bf7fbf")

						addLog("[Help] PFLFend: End PFLF game. (Format: .PFLFend)","#bf7fbf")
						addLog("[Help] Claim: Claim number in PFLF. (Format: .claim [number])","#bf7fbf")
						addLog("[Help] PFLFget: Print PFLF state. (Format: .PFLFget)","#bf7fbf")
						addLog("[Help] PFLFhighscore: Print PFLF highscore. (Format: .PFLFhighscore)","#bf7fbf")
					} else {
						addLog("[Help] Help: 打印所有可用指令。 (格式: .help)","#bf7fbf")
						addLog("[Help] PFLFstart: 和机器人7976玩PFLF。 (格式: .PFLFstart)","#bf7fbf")
						addLog("[Help] PFLFend: 结束PFLF游戏。 (格式: .PFLFend)","#bf7fbf")
						addLog("[Help] Claim: 在PFLF中收取数字。 (格式: .claim [数字])","#bf7fbf")
						addLog("[Help] PFLFget: 打印PFLF状态。 (格式: .PFLFget)","#bf7fbf")
						addLog("[Help] PFLFhighscore: 打印PFLF高分记录。 (格式: .PFLFhighscore)","#bf7fbf")
					}
				}
				if(commandInput==="PFLFstart" && player.PFLF.active===false) {
					validCommand=true
					player.PFLF.active=true
					player.PFLF.turn=0
					player.PFLF.score=-1001
					player.PFLF.clear=-1
					player.PFLF.dice=0
					commandInput="claim 0"
					addLog("[bot#7976] "+translateText("PFLF started!"),"#7f7fff")
				}
				if(commandInput==="PFLFend" && player.PFLF.active===true) {
					validCommand=true
					player.PFLF.active=false
					addLog("[bot#7976] "+translateText("PFLF ended!"),"#7f7fff")
				}
				if(commandInput.startsWith("claim ") && player.PFLF.active===true) {
					let testValid=true,claimNum=commandInput.slice(6).match(/^\d+/)
					if(claimNum===null) testValid=false
					if(testValid===true) {
						claimNum=parseInt(claimNum)
						testValid=isPFLF(claimNum)
					}
					if(testValid===true) {
						let testStr1=player.PFLF.dice.toString(),testStr2=claimNum.toString()
						if(testStr1==="0") testStr1=""
						if(testStr2==="0") testStr2=""
						for(let i=0;i<testStr2.length;i++) {
							if(testStr1.indexOf(testStr2[i])===-1) {
								testValid=false
							} else {
								testStr1=testStr1.slice(0,testStr1.indexOf(testStr2[i]))+testStr1.slice(testStr1.indexOf(testStr2[i])+1)
							}
						}
						if(testValid===true) {
							player.PFLF.score+=(testStr2.length+1)**3
							if(testStr1==="") {
								player.PFLF.clear++
								player.PFLF.score+=1000
							}
							player.PFLF.dice=parseInt("0"+testStr1)
						}
					}
					if(testValid===true) {
						if(player.PFLF.dice>100000) {
							if(player.PFLF.score>player.PFLF.highscore) {
								player.PFLF.highscore=player.PFLF.score
								player.PFLF.highscoreturn=player.PFLF.turn
								player.PFLF.highscoreclear=player.PFLF.clear
							}
							addLog("[bot#7976] "+translateText("Final Turn")+": "+player.PFLF.turn+", "+translateText("Score")+": "+player.PFLF.score+", "+translateText("Clear")+": "+player.PFLF.clear,"#7f7fff")
							player.PFLF.active=false
						} else {
							player.PFLF.turn++
							for(let i=1;i<=3;i++) player.PFLF.dice=player.PFLF.dice*10+dice()
							commandInput="PFLFget"
						}
					}
					validCommand=testValid
				}
				if(commandInput==="PFLFget" && player.PFLF.active===true) {
					validCommand=true
					addLog("[bot#7976] "+translateText("Turn")+": "+player.PFLF.turn+", "+translateText("Score")+": "+player.PFLF.score+", "+translateText("Clear")+": "+player.PFLF.clear+", "+translateText("Dice")+": "+player.PFLF.dice,"#7f7fff")
				}
				if(commandInput==="PFLFhighscore") {
					validCommand=true
					addLog("[bot#7976] "+translateText("Highest Score")+": "+player.PFLF.highscore+", "+translateText("Achieved with Turn ","EN")+translateText("以","CH")+player.PFLF.highscoreturn+translateText(" and Clear ","EN")+translateText("回合和","CH")+player.PFLF.highscoreclear+translateText("清场数达成","CH")+translateText("."),"#7f7fff")
				}
				if(validCommand===false) addLog("[Command] "+translateText("Invalid command. (Command not exist or available)"),"#bf7f3f")
			} else {
				addLog("[Chat] "+translateText("Traveler")+": "+commandInput.replaceAll("<","&lt;"))
			}
		}

		function roll(lowerLimit,upperLimit) {
			return Math.floor(Math.random()*(upperLimit-lowerLimit+1)+lowerLimit)
		}
		function roll2(lowerLimit,upperLimit) {
			return approx(Math.random()*(upperLimit-lowerLimit)+lowerLimit)
		}
		function dice() {
			return roll(1,6)
		}
		function determine(chance,log,logText="") {
			if(chance<0) chance=0
			if(chance>100) chance=100
			let result=false
			if(100*Math.random()<=chance) result=true
			if(log) {
				if(result) {
					addLog("[Determine] "+translateText("True ")+"("+betterFloor(chance)+"%)"+translateText(logText),"#3f3f3f")
				} else {
					addLog("[Determine] "+translateText("False ")+"("+(100-betterFloor(chance))+"%)"+translateText(logText),"#3f3f3f")
				}
			}
			return result
		}
		function toCord(originCord,modulo=8) {
			return (originCord%modulo+modulo-1)%modulo+1
		}
		function discalc(cord1,cord2,modulo=8) {
			let differ=Math.abs(cord1-cord2)
			if(modulo===0) return differ
			differ%=modulo
			if(modulo-differ<differ) differ=modulo-differ
			return differ
		}
		function compareVectorCloser(v1,v2) {
			if(v1.x**2+v1.y**2<v2.x**2+v2.y**2) return true
			if(v1.x**2+v1.y**2>v2.x**2+v2.y**2) return false
			let dir1=0,dir2=0
			if(v1.x===0&&v1.y<0) dir1=1
			if(v1.x>0) dir1=2
			if(v1.x===0&&v1.y>0) dir1=3
			if(v1.x<0) dir1=4
			if(v2.x===0&&v2.y<0) dir2=1
			if(v2.x>0) dir2=2
			if(v2.x===0&&v2.y>0) dir2=3
			if(v2.x<0) dir2=4
			if(dir1<dir2) return true
			if(dir1>dir2) return false
			return (v1.y/v1.x<v2.y/v2.x)
		}
		let vecArray=new Array()
		for(let i=-7;i<=7;i++) {
			for(let j=-7;j<=7;j++) {
				vecArray=vecArray.concat({x:i,y:j})
			}
		}
		for(let i=0;i<vecArray.length;i++) {
			for(let j=i+1;j<vecArray.length;j++) {
				if(compareVectorCloser(vecArray[j],vecArray[i])) {
					let tempVec=vecArray[j]
					vecArray[j]=vecArray[i]
					vecArray[i]=tempVec
				}
			}
		}

		function ladybugMove() {
			if(document.getElementById("gallery").style.display==="flex") {
				if(ladybugMovement===0) {
					ladybugTurn=roll(0,10)
					if(ladybugTurn>=1 && ladybugTurn<=9) ladybugTurn=roll(0,10)
					if(ladybugTurn>=1 && ladybugTurn<=5) ladybugTurn=roll(0,10)
					if(ladybugTurn>=1 && ladybugTurn<=3) ladybugTurn=roll(0,10)
					if(ladybugTurn>=1 && ladybugTurn<=2) ladybugTurn=roll(0,10)
					if(dice()<4) ladybugTurn*=-1
				}
				if(ladybugMovement<180 && roll(1,90)*Math.abs(ladybugTurn)>Math.abs(90-ladybugMovement)*10) {
					ladybugDegree=(ladybugDegree+Math.sign(ladybugTurn)+360)%360
					document.getElementById("ladybug").style.transform="rotate("+ladybugDegree+"deg)"
				}
				if(ladybugMovement>=180 && roll(1,90)*Math.abs(ladybugTurn)>Math.abs(270-ladybugMovement)*10) {
					ladybugX=(ladybugX+Math.sin(ladybugDegree/180*Math.PI)+100)%100
					ladybugY=(ladybugY-Math.cos(ladybugDegree/180*Math.PI)+100)%100
					document.getElementById("ladybug-bg").style.transform="translate(-"+ladybugX+"px, -"+ladybugY+"px)"
				}
				ladybugMovement=(ladybugMovement+1)%360
			}
		}

		function settingClick(setX,setY) {

			if(setX===1 && setY===1) {
				if(!player.settings.hasOwnProperty("closehelplog")) {
					cleanLog()
					player.settings.closehelplog=true
					getGrid(5,setX,setY).replaceWith(settingButton(setX,setY,"Off"))
				} else {
					cleanLog()
					delete player.settings.closehelplog
					getGrid(5,setX,setY).replaceWith(settingButton(setX,setY,"On"))
				}
			}
			if(setX===2 && setY===1) {
				if(!player.settings.hasOwnProperty("closecommandlog")) {
					cleanLog()
					player.settings.closecommandlog=true
					getGrid(5,setX,setY).replaceWith(settingButton(setX,setY,"Off"))
				} else {
					cleanLog()
					delete player.settings.closecommandlog
					getGrid(5,setX,setY).replaceWith(settingButton(setX,setY,"On"))

		function encodeFile(savestr) {
			if(savestr.length%2>0) savestr+="79.76"
			let encodedstr=""
			for(let i=0;i<savestr.length/2;i++) {
				let encodeValue=(savestr[2*i].charCodeAt()-20)*130+(savestr[2*i+1].charCodeAt()-20)
				encodedstr+=String.fromCharCode(65+betterFloor(encodeValue/676))
				encodedstr+=String.fromCharCode(65+betterFloor(encodeValue/26)%26)
				encodedstr+=String.fromCharCode(65+encodeValue%26)
			}
			for(let i=0;i<encodedstr.length;i++) {
				encodedstr=encodedstr.slice(0,i)+String.fromCharCode(65+(encodedstr[i].charCodeAt()+65+betterFloor((i+1)/(encodedstr.length+1)*354233654)%26)%26)+encodedstr.slice(i+1)
			}
			return encodedstr
		}
		function decodeFile(encodedstr) {
			let savestr=""
			for(let i=0;i<encodedstr.length;i++) {
				encodedstr=encodedstr.slice(0,i)+String.fromCharCode(65+(encodedstr[i].charCodeAt()+65-betterFloor((i+1)/(encodedstr.length+1)*354233654)%26)%26)+encodedstr.slice(i+1)
			}
			for(let i=0;i<encodedstr.length/3;i++) {
				let encodeValue=(encodedstr[3*i].charCodeAt()-65)*676+(encodedstr[3*i+1].charCodeAt()-65)*26+(encodedstr[3*i+2].charCodeAt()-65)
				savestr+=String.fromCharCode(20+betterFloor(encodeValue/130))
				savestr+=String.fromCharCode(20+encodeValue%130)
			}
			if(savestr[savestr.length-1]==="6") savestr=savestr.slice(0,-5)
			return savestr
		}
		function importSave() {
			if(animation) return
			document.querySelectorAll("input[type='file']").forEach(input => input.remove())
			let fileInput=document.createElement("input")
			fileInput.type="file"
			fileInput.accept=".txt"
			fileInput.style.display="none"
			fileInput.addEventListener("change",function(e) {
				let savefile=e.target.files[0]
				if(!savefile) {
					document.body.removeChild(fileInput)
					return
				}
				let reader=new FileReader()
				reader.onload=async function(event) {
					try {
						savefile=JSON.parse(decodeFile(event.target.result))
						if(!(savefile.player&&savefile.explore&&savefile.fight)) throw new Error()
						if(savefile.player.hasOwnProperty("memory")) {
							savefile.player.memory--
						} else {
							savefile.player.memory=3
						}
						if(savefile.player.memory<0) {
							alert(translateText("Error: Memory is broken"))
							return
						}
						clearAllInterval()
						localStorage.setItem("FLORROOMplayer",JSON.stringify(savefile.player))
						localStorage.setItem("FLORROOMexplore",JSON.stringify(savefile.explore))
						localStorage.setItem("FLORROOMfight",JSON.stringify(savefile.fight))
						document.getElementById("end1").style["pointer-events"]="unset"
						for(let i=0;i<=10;i++) {
							document.getElementById("end1").style.opacity=i/10
							await delay(100)
						}
						location.reload()
					} catch {
						document.body.removeChild(fileInput)
						alert(translateText("Error: Memory incomplete"))
					}
				}
				reader.readAsText(savefile)
			} )
			document.body.appendChild(fileInput)
			fileInput.click()
		}
		async function exportSave() {
			if(animation) return
			animation=true
			if(player.hasOwnProperty("memory")) player.memory--
			let savefile={player:player,explore:explore,fight:fight}
			if(player.hasOwnProperty("memory")) player.memory++
			let blob=new Blob([encodeFile(JSON.stringify(savefile))],{type:"text/plain"})
			let downloadElement=document.createElement("a")
			downloadElement.href=URL.createObjectURL(blob)
			if(player.memory===0) {
				downloadElement.download="broken memory.txt"
			} else {
				downloadElement.download="memory.txt"
			}
			downloadElement.click()
			document.getElementById("export-btn").innerHTML=translateText("Memories Stored!")
			await delay(1000)
			document.getElementById("export-btn").innerHTML=translateText("Store Memories")
			if(player.hasOwnProperty("memory")) document.getElementById("export-btn").innerHTML+=" ("+player.memory+")"
			animation=false
		}

		function updateCalendar() {
			let tickTime=100
			if(player.item.hasOwnProperty("Time Shard")) tickTime*=(1+0.1*player.item["Time Shard"])
			let timePassed=Date.now()-player.calendar.start
			if(timePassed<tickTime) return
			if(updatingCalendar) return
			updatingCalendar=true
			player.calendar.second+=betterFloor(timePassed/tickTime)
			player.calendar.start+=betterFloor(timePassed/tickTime)*tickTime
			let calendarFlag=true
			while(calendarFlag) {
				calendarFlag=false
				if(player.calendar.second>0 && player.calendar.minute<=79) {
					player.calendar.second--
					player.calendar.minute++
					calendarFlag=true
				}
				if(player.calendar.minute>79 && player.calendar.hour<79) {
					player.calendar.minute=1
					player.calendar.hour++
					calendarFlag=true
				}
				if(player.calendar.day<79 && player.calendar.hour===79 && player.calendar.minute===80) {
					player.calendar.second+=120
					calendarFlag=true
				}
				if(player.calendar.second>=120 && player.calendar.hour===79 && player.calendar.minute===80) {
					player.calendar.second=0
					player.calendar.minute=1
					player.calendar.hour=1
					player.calendar.day++
					document.getElementById("end1").style.opacity=0
					document.getElementById("end1").style["pointer-events"]="none"
					calendarFlag=true
				}
				if(player.calendar.second>0 && player.calendar.minute===80) {
					document.getElementById("end1").style["pointer-events"]="unset"
					if(player.calendar.second<=5) document.getElementById("end1").style.opacity=0.2*player.calendar.second
					if(player.calendar.second>=115) document.getElementById("end1").style.opacity=0.2*(120-player.calendar.second)
					if(player.calendar.second===10) document.getElementById("end2").innerText=translateText("Sleeping...")
					if(player.calendar.second>10 && player.calendar.second<=20) document.getElementById("end2").style.opacity=0.1*(player.calendar.second-10)
					if(player.calendar.second>=100 && player.calendar.second<110) document.getElementById("end2").style.opacity=0.1*(110-player.calendar.second)
					if(player.calendar.second===110) document.getElementById("end2").innerText=""
					if(player.calendar.second===5 && fight.active) {
						setPlayer()
						location.reload()
					}
					if(player.calendar.second===5 && explore.floor===0 && player.calendar.day>=79) {
						setPlayer()
						location.reload()
					}
					if(player.calendar.second===5 && explore.floor===1 && player.calendar.day>=79) {
						setPlayer()
						location.reload()
					}
				}
			}
			if(player.calendar.day<70) {
				document.getElementById("calendar-day").setAttribute("class","green")
			} else if(player.calendar.day<77) {
				document.getElementById("calendar-day").setAttribute("class","yellow")
			} else if(player.calendar.day<79) {
				document.getElementById("calendar-day").setAttribute("class","red")
			} else {
				document.getElementById("calendar-day").setAttribute("class","grey")
			}
			if(player.calendar.hour<=50) {
				document.getElementById("calendar-hour").setAttribute("class","green")
				document.getElementById("calendar-minute").setAttribute("class","green")
			} else if(player.calendar.hour<=70) {
				document.getElementById("calendar-hour").setAttribute("class","yellow")
				document.getElementById("calendar-minute").setAttribute("class","yellow")
			} else if(player.calendar.minute<=79) {
				document.getElementById("calendar-hour").setAttribute("class","red")
				document.getElementById("calendar-minute").setAttribute("class","red")
			} else {
				document.getElementById("calendar-hour").setAttribute("class","grey")
				document.getElementById("calendar-minute").setAttribute("class","grey")
			}
			document.getElementById("calendar-day").innerHTML=translateText("Day ","EN")+translateText("第","CH")+player.calendar.day+translateText("天","CH")
			document.getElementById("calendar-hour").innerHTML=player.calendar.hour
			if(player.calendar.hour<10) document.getElementById("calendar-hour").innerHTML="0"+player.calendar.hour
			document.getElementById("calendar-minute").innerHTML=Math.min(player.calendar.minute,79)
			if(player.calendar.minute<10) document.getElementById("calendar-minute").innerHTML="0"+player.calendar.minute
			setPlayer()
			setFight()
			document.getElementById("calendar").style.display="flex"
			updatingCalendar=false
		}

		function updateHome() {
			scaleSize=Math.min(parseFloat(window.getComputedStyle(containElement).height),parseFloat(window.getComputedStyle(containElement).width))
			let scaledX=mapcX/parseFloat(window.getComputedStyle(containElement).width)
			let scaledY=mapcY/parseFloat(window.getComputedStyle(containElement).height)
			let scaledX2=scaledX+(flowerSpotX-50)/parseFloat(window.getComputedStyle(containElement).width)
			let scaledY2=scaledY+(flowerSpotY-50)/parseFloat(window.getComputedStyle(containElement).height)
			let scaleDistance=Math.max(Math.abs(scaledX),Math.abs(scaledY))
			let scaleDistance2=Math.max(Math.abs(scaledX2),Math.abs(scaledY2))
			if(Math.abs(scaledX)*scaleSize<50 && Math.abs(scaledY)*scaleSize<50) {
				homeElement.style.display="none"
			} else {
				homeElement.style.left=50+scaledX/scaleDistance*40+"%"
				homeElement.style.top=50+scaledY/scaleDistance*40+"%"
				homeElement.style.display="unset"
			}
			if((Math.abs(scaledX2)*scaleSize<50 && Math.abs(scaledY2)*scaleSize<50) || (flowerSpotX===50 && flowerSpotY===50)) {
				homeFlowerElement.style.display="none"
			} else {
				homeFlowerElement.style.left=50+scaledX2/scaleDistance2*40+"%"
				homeFlowerElement.style.top=50+scaledY2/scaleDistance2*40+"%"

		function getSpotCord(value) {
			let spotD=document.querySelector("path[value='"+value+"']").getAttribute("d")
			let spotCord=new Object()
			spotCord.x=parseInt(/(?<=M)\d+/.exec(spotD))
			if(isNaN(spotCord.x)) spotCord.x=-parseInt(/(?<=M-)\d+/.exec(spotD))
			spotCord.y=parseInt(/(?<=M-?\d+\s)\d+/.exec(spotD))+2
			if(isNaN(spotCord.y)) spotCord.y=-parseInt(/(?<=M-?\d+\s-)\d+/.exec(spotD))+2
			return spotCord
		}
		function distance(cord1,cord2) {
			if(typeof(cord1)==="string") cord1=parseInt(cord1)
			if(typeof(cord2)==="string") cord2=parseInt(cord2)
			if(cord1===cord2) return 0
			if(pathArray.indexOf(cord1*100+cord2)===-1 && pathArray.indexOf(cord2*100+cord1)===-1) return -1
			let disx=getSpotCord(cord2).x-getSpotCord(cord1).x,disy=getSpotCord(cord2).y-getSpotCord(cord1).y,disv=(disx*disx+disy*disy)**0.5+20
			if(cord1-cord1%10!==cord2-cord2%10) disv=disv*1.5+50
			return betterFloor(disv)
		}
		function scaledDistance(cord1,cord2) {
			if(typeof(cord1)==="string") cord1=parseInt(cord1)
			if(typeof(cord2)==="string") cord2=parseInt(cord2)
			let unscaledDistance=distance(cord1,cord2)
			if(player.item.hasOwnProperty("Bubble Essence")) unscaledDistance/=(1+0.5*player.item["Bubble Essence"])
			if(player.item.hasOwnProperty("Travel Ticket") && cord1-cord1%10===cord2-cord2%10) unscaledDistance/=(1+0.2*player.item["Travel Ticket"])
			return unscaledDistance
		}

		function travel(spot) {
			if(explore.floor===2 && spot>=60) return

			explore.floweroldspot=explore.flowerspot
