			bookHTMLTrans["Flower Artisan Guide"]="<h2>花朵工艺指南</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>将常见的花瓣组合或者提炼，化为新的形式。组合相似的花瓣，则在[级别]上更进一步，使其更为锋利。提炼高[级别]的花瓣，则在[品质]上更进一步，使其经久耐用。唯有将两种方法牢记于心，才能将敌人尽数征服。此书指引你在花瓣制作工艺上登峰造极。</span><br><span>对于[升阶]，你只需要选择1个拥有正[强化等级]的花瓣（而且不能是神话[稀有度]的）。[强化等级]越高，成功率越高。对于[强化等级]不低于3的花瓣，成功率恒定为100%。但是，在有些情况下，你会发现这是不值得的。更高的[稀有度]在提升花瓣[耐久]的同时，还可能使[伤害]显著降低。这是因为<span class='bold'>[升阶]将会重置[强化等级]</span>。</span><br><span>对于[升级]，你需要选择至少两个[稀有度]和[强化等级]均相同的同种花瓣。成功率随[稀有度]和[强化等级]的增长而降低，直到3[强化等级]时停止。你可以通过同时投入更多的花瓣增加成功的概率。投入(X+1)个花瓣将会使概率变为基础值的X倍。不过注意，超过100%的成功概率是没有作用的，而且当失败时，损失的花瓣数介于1和X之间，所以将所有花瓣放在一起合成并不是明智之举。</span><br><span>在开始前，还要提醒你一点：[四基础影响因子]（[速度]，[冷却]，[攻击率加成]，[防御率加成]）在[升阶]时<span class='bold'>保留</span>，在[升级]时<span class='bold'>分别独立继承</span>一个材料的相应属性。明智的选择你的材料！这里还有一个使用便捷的多功能计算器，只需要简单输入稀有度和等级，比如3 0或者4 2。</span><input type='text' tabindex='-1' id='craft-detail' onkeydown='craftdetail(event.key)' class='inner-input' list='craftdetaillist' autocomplete='off' title='Craft Detail'><datalist id='craftdetaillist'><option value='3 0'><option value='4 2'></datalist>"
			bookHTMLTrans["Flower Combat Guide"]="<h2>花朵战斗指南</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>生物会在你第一次踏入一个地图时生成，与你战斗。有一个和楼层相关的阈值，防止过多生物同时生成。因此，当你击败一个生物后，新的生物可能会继续生成。</span><br><span>一个战斗回合分为以下几部分：在开始时，你的花瓣根据速度属性获得行动条。你可以[移动]花瓣，使用花瓣[攻击]，或是使用花瓣的[特殊技能]。随后，生物获得行动条，行动条达到或超过阈值的生物对你发起攻击，而你使用花瓣进行防御。如果你跳过防御阶段，或者防御失败，你将会受到伤害。默认数值下，[移动]花瓣消耗100行动条，使用花瓣[攻击]消耗200行动条，生物行动的阈值为200行动条。</span><br><span>你的花瓣可以在<span class='bold'>同列或侧列</span>[攻击]或者[防御]生物。[攻击]生物的成功率取决于花瓣[攻击率]（[前排攻击率]为[攻击率2]，[中排攻击率]为[攻击率1]）和生物[闪避率]，[防御]生物的成功率取决于[花瓣防御率]（[后排防御率]为[防御率2]，[中排防御率]为[防御率1]）和生物[闪避率]。这两者的公式有明显的区别。当生物在侧列时，公式中还会加入花瓣的[尺寸]属性。花瓣[尺寸]上限20，但对于侧列防守的最佳值为<span class='bold'>17到18[尺寸]</span>。</span><br><span>对发射类花瓣，在进行任何[弹射]之前，在[射程]内的[命中率]（即对于发射类花瓣，在攻击成功率公式中的[攻击率]）恒定为100%。对每单位超过[射程]的距离，[命中率]减少[命中率衰减]。如果它命中了目标，还可以在生物间[弹射]。每次指定已经被命中过的生物为目标时，[命中率]减少[重复命中率衰减]。每个超过[弹射数]的[弹射]使[命中率]降低[弹射命中率衰减]。任何[弹射]只能指定[弹射射程]内的生物为目标。</span><br><span>你面对的敌人来自四面八方，所以<span class='bold'>第一列和最后一列是相连的</span>，这意味着你的花瓣或者生物都可以从第一列移动到最后一列，反之亦然，并且第一列和最后一列是彼此的侧列。两个方格的距离由曼哈顿距离（横向与纵向距离之和）给出，<span class='bold'>而非使用勾股定理计算</span>。'退场'意味着一个花瓣消失，并且不能在同场战斗中再次使用。如果你被击败，你只有30%的概率暂时保留你的掉落物，并且在你再次失败后可能仍会丢失。</span><br><span>你可以在下面的输入框中计算概率。例如，Aa-48S12计算使用12[尺寸]，100%[攻击率]，-4[攻击率加成]的花瓣在侧列攻击80%[闪避率]的生物的成功率。A4+a6F计算使用40%[攻击率]，+10[攻击率加成]的花瓣在同列攻击60%[闪避率]的生物的成功率。D3+05F计算使用30%[防御率]，+0[防御率加成]的花瓣在同列防御50%[闪避率]的生物的成功率。</span><input type='text' tabindex='-1' id='combat-calc' onkeydown='combatcalc(event.key)' class='inner-input' list='calclist' autocomplete='off' title='Calculator'><datalist id='calclist'><option value='Aa-48S12'><option value='A4+a6F'><option value='D3+05F'></datalist>"
			bookHTMLTrans["Flower Control Guide"]="<h2>花朵操控指南</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><h3>快捷键</h3><div class='green-bg inner-box'><span style='color: #7f7f7f'>S：开/关设置</span><span style='color: #7f7f7f'>H：开/关帮助</span><span style='color: #7f7f7f'>Z：开/关仓库</span><span style='color: #7f7f7f'>V：开/关图鉴</span><br><span style='color: #9f9f00'>W=↑：上移</span><span style='color: #9f9f00'>D=→：右移</span><span style='color: #9f9f00'>S=↓：下移</span><span style='color: #9f9f00'>A=←：左移</span><br><span style='color: #009f9f'>T：结束回合（大部分情况下）</span><span style='color: #009f9f'>M：移动</span><span style='color: #009f9f'>R：攻击</span><span style='color: #009f9f'>X：特殊行动（不限于技能）</span><br><span style='color: #ffffff'>回车键：确认</span><span style='color: #ffffff'>退格键：取消</span></div>"
			bookHTMLTrans["Flower Debate Guide"]="<h2 style='color: #7eef6d'>花朵辩论指南</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>1层小游戏：语言艺术。</span><span>奖励：各种好东西，包括天赋系统。</span><span class='bold'>你必须在1层完成相关等级游戏，才能激活天赋系统。</span><br><br><span>在游戏的开始，你和对手拥有相同气势值。当一方的气势值归零时，另一方获胜。你只会在第一次取胜时获得奖励。游戏失败<span class='bold'>没有惩罚</span>，并且不限制尝试次数。</span><br><span>一共有4种基本卡：岩石(25%)，血刺(25%)，骰子(25%)，空气(10%)。基本卡具有普通到史诗的[稀有度]，以及0到3的[强化等级]，它们是没有属性浮动的花瓣。如果你获得了一张高[品阶]（[稀有度]和[强化等级]的统称）的基本卡，但没有任何相应[品阶]的花瓣，这张卡的[强化等级]将会被降低，直到你有相同[品阶]的花瓣。如果[强化等级]降为0之后还没有相同[品阶]的花瓣，[稀有度]继续降低。</span><br><span>一共有4种进阶卡：世界树(2%)，批判(6%)，无视(6%)，刷新(1%)。进阶卡的[稀有度]固定为传奇，[强化等级]固定为0。每个玩家始终有6张卡牌。</span><br><span>一共有5种主题：耐久(25%)，伤害(25%)，回合均伤(25%)，特殊(20%)，稀缺性(5%)。对于每个主题，两位玩家选择一张卡牌进行比较，输家的气势值减少1。随后，两位玩家抽一张新卡，并开始新的主题。每个主题具有<span class='bold'>不同的判定标准</span>：</span><span>1. 耐久花瓣：如果两位玩家均使用基本卡，耐久更高者获胜。</span><span>2. 伤害花瓣：如果两位玩家均使用基本卡，伤害更高者获胜。血刺的伤害记为2倍（已经体现在卡牌信息中）。</span><span>3. 回合均伤花瓣：如果两位玩家均使用基本卡，回合均伤更高者获胜。骰子的回合均伤记为6倍，石头按照能攻击2次计算（已经体现在卡牌信息中）。</span><span>4. 特殊花瓣：如果两位玩家均使用基本卡，使用空气者获胜。</span><span>5. 稀缺花瓣：如果两位玩家均使用基本卡，平局。</span><br><span>世界树：在主题1~3中，视为基本卡。在主题4~5中，战胜先前所有卡牌。在主题5中获胜时，对手<span class='bold'>额外损失2气势值</span>。</span><span>批判：在所有主题中，战胜先前所有卡牌。</span><span>无视：在所有主题中，战胜先前所有卡牌，但是输家的气势值保持不变。</span><span>刷新：在所有主题中，战胜先前所有卡牌，但是输家的气势值保持不变。作为替代，赢家丢弃所有卡牌，并抽取新的卡牌。</span><br><span>你可以看见你对手卡牌的稀有度。而且你[[注意力惊人]]，当对手获得或移动空气卡牌时有20%概率被你认出。</span>"
			bookHTMLTrans["Flower Design Guide"]="<h2 style='color: #ffe65d; filter: brightness(90%); pointer-events: none'>花朵设计指南</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>2层小游戏：穿搭技巧。</span><span>奖励：一些好东西。在Meta中获得75分有奖励，在完成之后还有更多奖励。</span><span class='bold'>你只能在2层解锁舞台。</span><br><br><span>游戏分为5个舞台：4个普通舞台和Meta舞台。对于每个舞台，一共有4条<span class='bold'>独立</span>规则。你的目标是找出所有规则，并且在舞台中获得满分，将其完成。你可以上传一个<span class='bold'>由6个花瓣构成的</span>构筑进行尝试，不同舞台会根据舞台规则给出不同信息。你只会在完成Meta舞台时获得奖励，剩下4个舞台除了对于Meta的线索没有奖励。尝试后<span class='bold'>没有惩罚</span>，但是你不能在一天内对同个舞台进行二次提交。</span><br><span>为解锁一个舞台，或者获得提示，你需要一封<span class='bold'>邀请函</span>，它们在外界的不同地点，需要仔细寻找才能发现。花园一共有12封邀请函，丛林一共有8封邀请函，其余群系各有2封邀请函。</span><br><span>（免费提示：建议使用英语游玩）</span>"
			bookHTMLTrans["Flower Environmental Guide"]="<h2 style='color: #ffe65d; filter: brightness(90%); pointer-events: none'>花朵环境指南</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>从现在开始，周围的[环境]正发生改变，并且在将来继续<span class='bold'>恶化</span>。水土不服的花朵将会面临重重险阻，而适应于[环境]的生物如鱼得水，甚至能将[环境]化为己用。这将是巨大的挑战。[环境]与地图所处的群系息息相关。在继续前进的道路上，你需要注意[环境]的变化，并做好准备。以下是一些关于[环境]的信息。</span>"
			bookHTMLTrans["Flower Evolutionary Guide"]="<h2>花朵进化指南</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>消耗花瓣，取其精华。以最原始的能量滋养你的成长，使你升级进化。随着一缕缕[经验]的注入，你变得更强，打开高阶能力的道路，自然取得新的高度。这一古老的生长循环将在此书中详细展开。</span><br><span>你从击败的生物上获得花瓣，高[稀有度]的生物具有更好的掉落物。不同生物掉落各式各样的花瓣，掉率从1档到5档不等，你可以在图鉴中查看细节。一个花瓣的[基础经验]是<span class='bold'>([稀有度因子])*([强化等级]+1)</span>。对于普通，罕见，稀有，史诗，传奇，神话花瓣，[稀有度因子]分别是8，12，20，40，100，300。随后，这个数值被乘以一个0.8到1.2之间的随机数，并被四舍五入至整数，所以[经验]的期望值与[基础经验]相等。</span><br><span>这并不是一个难以理解的机制，为此你并不需要一个计算器，所以我提供了另一个计算器帮你计算花瓣的基础属性。<span class='bold'>除了一些特殊种类外</span>，你获得的花瓣具有20%属性浮动。你只需要简单输入[名称]，[稀有度]，[强化等级]就能使用下面这个输入框。例如，Corn 3 0计算[稀有度]为稀有的玉米的属性，Plank 4 2计算[稀有度]为史诗，[强化等级]为2的木板的属性。</span><input type='text' tabindex='-1' id='petal-stat' onkeydown='petalstat(event.key)' class='inner-input' list='petalstatlist' autocomplete='off' title='Petal Stat'><datalist id='petalstatlist'><option value='Corn 3 0'><option value='Plank 4 2'></datalist>"
			bookHTMLTrans["Flower Game Guide"]="<h2>花朵游戏指南 <span style='color: #0078d7; font-style: italic; font-size: 12px; font-weight: noremal'>//六三六一（试图翻译C++代码限定版）</span></h2><div class='white-bg inner-box'><span style='color: #008000'>#包含&lt;游玩PFLF的工具.h&gt; <span style='color: #0078d7; font-style: italic;'>//应当进行替代</span></span><span style='color: #008000'>#包含&lt;io小河&gt;</span><span style='color: #008000'>#包含&lt;时间.h&gt;</span><span style='color: #008000'>#包含&lt;数学.h&gt;</span><span style='color: #008000'>#包含&lt;细绳.h&gt;</span><span style='color: #008000'>#包含&lt;f小河.h&gt;</span><span><span style='font-weight: bold'>正在使用 命名空间</span> std<span style='color: #ff0000; font-weight: bold'>;</span></span><span><span style='font-weight: bold'>虚无</span> 菜单<span style='color: #ff0000; font-weight: bold'>()</span></span><span style='color: #ff0000; font-weight: bold'>{</span><span style='margin-left: 2em'>系统<span style='color: #ff0000; font-weight: bold'>(</span><span style='color: #0000ff; font-weight: bold'>\"cls\"</span><span style='color: #ff0000; font-weight: bold'>);</span></span><span style='margin-left: 2em'>缓慢输出<span style='color: #ff0000; font-weight: bold'>(</span><span style='color: #0000ff; font-weight: bold'>\"↓更多 游戏 (点击!)↓\"</span><span style='color: #ff0000; font-weight: bold'>,</span><span style='color: #800080'>50</span><span style='color: #ff0000; font-weight: bold'>);</span></span><span style='margin-left: 2em'>缓慢输出<span style='color: #ff0000; font-weight: bold'>(</span><a href='https://6triple6single.github.io/PFLF' target='_blank' style='color: #0000ff; font-weight: bold; text-decoration: none'>\"PFLF\"</a><span style='color: #ff0000; font-weight: bold'>,</span><span style='color: #800080'>50</span><span style='color: #ff0000; font-weight: bold'>);</span></span><span style='margin-left: 2em'>缓慢输出<span style='color: #ff0000; font-weight: bold'>(</span><a href='https://6triple6single.github.io/Virus1' target='_blank' style='color: #0000ff; font-weight: bold; text-decoration: none'>\"病毒 1\"</a><span style='color: #ff0000; font-weight: bold'>,</span><span style='color: #800080'>50</span><span style='color: #ff0000; font-weight: bold'>);</span></span><span style='margin-left: 2em'><span style='font-weight: bold'>返回</span><span style='color: #ff0000; font-weight: bold'>;</span></span><span style='color: #ff0000; font-weight: bold'>}</span><span><span style='font-weight: bold'>整数</span> 主要<span style='color: #ff0000; font-weight: bold'>()</span></span><span style='color: #ff0000; font-weight: bold'>{</span><span style='margin-left: 2em'>系统<span style='color: #ff0000; font-weight: bold'>(</span><span style='color: #0000ff; font-weight: bold'>\"cls\"</span><span style='color: #ff0000; font-weight: bold'>);</span></span><span style='margin-left: 2em'>沉睡<span style='color: #ff0000; font-weight: bold'>(</span><span style='color: #800080'>2000</span><span style='color: #ff0000; font-weight: bold'>);</span></span><span style='color: #0078d7; font-style: italic; margin-left: 2em'>// 加载文本();</span><span style='color: #0078d7; font-style: italic; margin-left: 2em'>// 加载图鉴();</span><span style='color: #0078d7; font-style: italic; margin-left: 2em'>// 加载功绩();</span><span style='margin-left: 2em'>菜单<span style='color: #ff0000; font-weight: bold'>();</span></span><span style='margin-left: 2em'><span style='font-weight: bold'>返回</span> <span style='color: #800080'>0</span><span style='color: #ff0000; font-weight: bold'>;</span></span><span style='color: #ff0000; font-weight: bold'>}</span></div>"
			bookHTMLTrans["Flower Subsist Guide"]="<h2 style='color: #7eef6d'>花朵维生指南</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>旅行者，在这场漫长的旅程中，未免会感到无聊与疲惫吧。你需要足够的时间强化自身，向高处攀登。可时间从不等人，如果你不全速前进，迎接你的将是花室的倒塌。</span><br><span>你或许已经意识到了，事情远不止这么简单，你的[能量]已经开始缓慢但稳定的流失。左侧的青色竖条代表你的[能量]，[能量]越低，你越弱小。[能量]的上界是100%，下界是36%。永远不要尝试让[能量]跌破<span class='bold'>64%</span>的安全线，这只会加速你的死亡。</span><br><span>那就更具体的说说[能量]对战斗的影响吧。由于[能量]的流失，花瓣受击将会损耗更多[耐久]，为原始值的1/[能量]倍。你的花瓣对生物造成更低的伤害，为原始值的[能量]倍。在跌破安全线后，花朵受到更多的伤害，为原始值的0.3/([能量]-35%)倍。花瓣也收到更少的行动条，为速度的([能量]-35%)/0.3倍。</span><br><span>你应该力求足够的[能量]进入下一层，在那里你会获得6%的[能量]恢复。不要浪费提供[能量]恢复的道具，这些道具极其稀少，对于生存至关重要。为了避免流失过多[能量]，记牢以下两点：</span><span>1. 不要在战斗中花费太多回合，每回合都会流失0.01%[能量]。</span><span>2. 尽可能防御生物的攻击，每次受伤会使你失去0.03%[能量]。</span><br><span>就这样吧，祝你好运。</span>"
			bookHTMLTrans["Flower Survival Guide"]="<h2>花朵生存指南</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>你说得对，但是《弗洛尔房间》是由[七十九的平方等于六三六一]自主研发的一款全旧封闭卡牌游戏。游戏发生在一个被称作[花室]的幻想世界，在这里，被[M614656]选中的人将被授予[槽位]，导引花瓣之力。你将扮演一位名为[旅行者]的神秘角色，在从0层（也就是基层）攀爬到7层的旅途中肘飞技能各异，奖励独特的同伴们，把他们和强敌一起击败，找回失散的图鉴，后面忘了。</span><br><span>这是你的第一本书，随着故事的发展，你会收获更多知识，同样可以在帮助页面查看。如果你没有在[花室]战斗的经验，无伤大雅，我写了<span class='bold'>花朵战斗指南（Flower Combat Guide）</span>和<span class='bold'>花朵术语指南（Flower Terminology Guide）</span>，在下面输入书的（英文）名称即可获得！</span><br><span>如果你想起来了什么，写在下面的输入框，取回相应的物品。</span><input type='text' tabindex='-1' id='item-code' onkeydown='itemcode(event.key)' class='inner-input' autocomplete='off' title='Code'><span>（不区分<span style='font-size: 1.1em'>大</span><span style='font-size: 0.9em'>小</span>写&amp;自动 忽略 空 格）</span>"
			bookHTMLTrans["Flower Talent Guide"]="<h2 style='color: #7eef6d'>花朵天赋指南</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><span>唤醒你身体的潜能。[天赋点]通过升级获取，激活天赋后，你可以通过投入[天赋点]激活自身的先天能力。注意，天赋的路线并非一成不变。你可以重置你的选择，取回[天赋点]，但每次重塑会有<span class='bold'>增长的代价</span>。三思而后行。</span><br><span>普通天赋在5级解锁，每个花费2TP（即[天赋点]）。稀有天赋在10级解锁，每个花费3TP。神话天赋在15级解锁，每个花费5TP。购买STA1~3开始一棵天赋树。你可以购买以枝干相连的节点，它们被染成黄色。此外还有\"-XTP\"的节点，它们连接相似的天赋，使你在同时学习两者时花费更少TP。例如，购买TRE1~5和THR1~5需要20TP，但是购买TRE1~5，-5TP和THR5只需要17TP。每个天赋<span class='bold'>只有最高等级</span>生效。</span><br><span>最下方列出的天赋，对应的节点字母分别是：THR，TRE，REC，PRO，SER；SKI，AGI，FOR，LUC，GRO；HYP，EXP，IMP。</span>"
			bookHTMLTrans["Flower Terminology Guide"]="<h2>花朵术语指南</h2><span class='nowrap'>🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲🎲</span><br><h3>稀有度</h3><span style='color: #000000'>0=无</span><span style='color: #7eef6d'>1=普通</span><span style='color: #ffe65d'>2=罕见</span><span style='color: #ffe65d; filter: brightness(90%)'>(2)=罕见</span><span style='color: #4d52e3'>3=稀有</span><span style='color: #861fde'>4=史诗</span><span style='color: #de1f1f'>5=传奇</span><span style='color: #1fdbde'>6=神话</span><span style='color: #ff2b75'>7=究极</span><span style='color: #2bffa3'>8=超级</span><span style='color: #2bffa3; filter: brightness(90%)'>(8)=超级</span><span style='color: #555555'>9=唯一</span><h3>花瓣面板</h3><span><span class='bold'>耐久</span>：花瓣在摧毁前可以承受的伤害。</span><span><span class='bold'>伤害</span>：花瓣可以造成的伤害。</span><span><span class='bold'>尺寸</span>：尺寸是介于1和20之间的数值，影响侧列攻击/防御的准度。侧列攻击/防御中，最终生效的攻击率/防御率百分比会减少(18-尺寸)(17-尺寸)/2。</span><span><span class='bold'>速度</span>：花瓣每回合获得的行动条。</span><span><span class='bold'>冷却</span>：花瓣被重新加载所需要的行动条。</span><span><span class='bold'>行动条</span>：花朵回合开始时你的花瓣获得行动条。行动条可以用来重新加载花瓣，移动花瓣，或者使用花瓣攻击。部分花瓣的技能需要行动条发动。</span><span><span class='bold'>攻击率</span>：花瓣攻击的准度。只有正攻击率的花瓣才能被用来攻击。攻击率1（箭头前面）决定了花瓣在中排时的攻击准度，攻击率2（箭头后面）决定了花瓣在前排时的攻击准度。</span><span><span class='bold'>防御率</span>：花瓣防御的准度。只有正防御率的花瓣才能被用来防御。防御率1（箭头前面）决定了花瓣在中排时的防御准度，防御率2（箭头后面）决定了花瓣在后排时的防御准度。</span><span><span class='bold'>攻击率加成</span>：攻击率加成是介于-10和10之间的数值，影响生效的攻击率百分比。低于5攻击率加成的花瓣在侧列攻击时会额外受到一个削弱。</span><span><span class='bold'>防御率加成</span>：防御率加成是介于-10和10之间的数值，影响生效的防御率百分比。低于5防御率加成的花瓣在侧列防御时会额外受到一个削弱。</span><span><span class='bold'>属性浮动</span>：花瓣的耐久/伤害/速度/冷却属性具有20%/20%/10%/10%浮动值。后面的<span class='bold'>强强/有点强/平均水准/有点弱/弱弱</span>表示这个属性（相较于同品阶同种花瓣）的强度，冷却越低越好。</span><br><h3>生物面板</h3><span><span class='bold'>被动</span>：生物在默认情况下不会攻击你。</span><span><span class='bold'>中立</span>：生物在受到你花瓣造成的伤害前不会攻击你。大部分中立生物有几率在行动前转为敌对。</span><span><span class='bold'>中立+</span>：敌对状态的中立生物。</span><span><span class='bold'>敌对</span>：生物在行动时会攻击你。</span><span><span class='bold'>生命值</span>：生物被摧毁前可以承受的伤害。</span><span><span class='bold'>伤害</span>：生物可以造成的伤害。</span><span><span class='bold'>闪避率</span>：生物的准度，同时也降低被命中的概率。</span><span><span class='bold'>速度</span>：生物每回合获得的行动条。</span><span><span class='bold'>行动条</span>：生物在生物回合开始后获得行动条。生物行动花费200行动条。</span><br><h3>花瓣词条</h3><span><span class='bold'>词条</span>：花瓣的特性或技能，只取决于花瓣种类。</span><span><span class='bold'>形态</span>：花瓣能以一种特定形态被装备，不同形态的同种花瓣具有不同特性。</span><span><span class='bold'>名称</span>：花瓣特定形态的名称。</span><span><span class='bold'>装饰物</span>：装饰物花瓣没有实体，它们像物品一样被装备，不能移动。</span><span><span class='bold'>部分</span>：花瓣具有多个部分。在耐久变为0时，花瓣丢失1个部分数，而不是直接摧毁，溢出的伤害被清除。</span><span><span class='bold'>花瓣属性</span>：花瓣的先天特性，这甚至可以影响仓库中的花瓣。</span><span><span class='bold'>装备时</span>：特殊影响，只在战斗开始时作用一次。</span><span><span class='bold'>存在时</span>：花瓣被加载后，产生持续性的影响。</span><span><span class='bold'>攻击时</span>：花瓣攻击的连带作用。</span><span><span class='bold'>防御时</span>：花瓣防御的连带作用。</span><span><span class='bold'>攻击或防御时</span>：花瓣攻击或防御时的连带作用。</span><span><span class='bold'>发射时</span>：花瓣可以被发射。细节已经在花朵战斗指南中列出。</span><span><span class='bold'>特殊技能</span>：花瓣的特殊技能。在一些情况下有使用条件，但默认情况下不消耗行动条。</span><span><span class='bold'>回合开始后</span>：在花朵回合开始时的效果。</span><span><span class='bold'>回合结束前</span>：在花朵回合结束前的效果。</span><span><span class='bold'>部分摧毁时</span>：在花瓣的一部分被摧毁时会发生的事，最后一部分除外。</span><span><span class='bold'>摧毁时</span>：花瓣彻底被摧毁后会发生的事。重置属性意味着通过该花瓣的其它词条获得的削弱/增益会被重置。</span><span><span class='bold'>退场</span>：退场的花瓣不能在同场战斗中使用。</span><br><span><span class='bold' style='color: #bf00bf; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>剧毒</span>：花瓣能造成剧毒伤害，这是一种特殊伤害。</span><span><span class='bold' style='color: #7fffff; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>闪电</span>：花瓣能造成闪电伤害，这是一种特殊伤害。</span><span>词条中的数值标识：<span class='bold' style='color: #7fdf7f; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>耐久</span>，<span class='bold' style='color: #ff7f7f; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>伤害</span>，<span class='bold' style='color: #00dfff; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>稀有度</span>，<span class='bold' style='color: #9f5fff; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>等级</span>，<span class='bold' style='color: #9f5f9f; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>计算值</span></span><br><h3>生物词条</h3><span><span class='bold'>Boss</span>：Boss生物在被花瓣攻击时获得迅捷效果。迅捷效果在生物行动后重置为0。</span><span><span class='bold'>生命</span>：生物具有多于1条生命。在生命值变为0时，生物丢失1个生命数，而不是直接摧毁，溢出的伤害被清除。同样也称为<span class='bold'>部分</span>。</span><span><span class='bold'>生物属性</span>：生物与生俱来的特性。</span><span><span class='bold'>回合开始后</span>：在生物回合开始前的效果。不需要花费行动条。</span><span><span class='bold'>存在时</span>：生物存活时，产生持续性的影响。</span><span><span class='bold'>敌对转化率</span>：中立生物在行动前有概率转为敌对状态（也就是中立+）。</span><span><span class='bold'>生物行动</span>：这个生物可能不使用默认行动。</span><span><span class='bold'>攻击时</span>：生物攻击的连带作用。</span><span><span class='bold'>特征</span>：一些有关结算伤害的特点。</span><span><span class='bold'>部分摧毁时</span>：在生物的一部分被摧毁时会发生的事，最后一部分除外。</span><span><span class='bold'>摧毁时</span>：生物彻底被摧毁后会发生的事。</span><span><span class='bold'>退场</span>：退场的生物会无掉落摧毁。</span><br><span><span class='bold' style='color: #bf00bf; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>剧毒</span>：生物能造成剧毒伤害，这是一种特殊伤害。</span><span><span class='bold' style='color: #7fffff; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>闪电</span>：生物能造成闪电伤害，这是一种特殊伤害。</span><span>词条中的数值标识：<span class='bold' style='color: #7fdf7f; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>生命值</span>, <span class='bold' style='color: #ff7f7f; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>伤害</span>, <span class='bold' style='color: #9f5f9f; text-shadow: 1px 1px 3px rgba(0,0,0,0.7)'>计算值</span>"
			document.getElementById("import-btn").innerHTML="取回记忆"
			document.getElementById("restart-btn").innerHTML="重启宇宙"
			document.getElementById("export-btn").innerHTML="存储记忆"
			versionAnnouncement="<h2>公告</h2><span>在你离开期间，这个游戏已经更新了79次！</span><span>在开始游戏前。你想要进行<span class='bold'>硬重置</span>吗？</span><br><span>上次更新在2026/6/26，</span><span>更新了语言设置。</span><br><span>上上次更新在2026/5/29，</span><span>更新了花朵术语指南。</span><span>检查花朵生存指南就能发现。</span><br><span>上次大更新在2026/5/17，</span><span>更新了2层。</span><span>没有完工所以不能进丛林。</span><br><button type='button' tabindex='-1' id='version3' onclick='updateVersion(false)'>不，直接更新版本号。</button><br><button type='button' tabindex='-1' id='version4' onclick='updateVersion(true)'>好，先硬重置了再说。</button>"
		}
